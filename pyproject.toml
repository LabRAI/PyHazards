[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhazards"
version = "1.0.6"
description = "A Python framework for AI-powered hazard prediction and risk assessment"
readme = "README.md"
authors = [{ name = "Xueqi Cheng", email = "xc25@fsu.edu" }]
license = "MIT"
requires-python = ">=3.8, <3.13"

dependencies = [
    "torch>=2.3.0,<3.0",
    "numpy>=1.19.0",
    "scipy>=1.6.0",
    "scikit-learn>=0.24.0",
    "h5py>=3.8.0",
    "requests>=2.28.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",
    "tqdm>=4.50.0",
    "pyyaml>=5.3.0",
    "pydantic>=2.0.0"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# The `xgboost` model (XGBoost on the Kondylatos et al. 2022 instance features). It uses the library
# defaults, which changed in xgboost 2.0 (hist trees, estimated base_score); checked with 3.2.0.
# `pip install xgboost-cpu` provides the same module without the CUDA/NCCL wheels.
xgboost = ["xgboost>=2.0"]
# Reprojecting a LANDFIRE fuel raster onto a Track-O cache grid
# (pyhazards.datasets.wildfire.track_o_cache.align_fuel_to_grid); imported only there.
geo = ["rasterio>=1.3"]
# Loss-curve PNGs written by scripts/run_wildfire_track_o_baselines.py; skipped without it.
plot = ["matplotlib>=3.5"]
# Prompted multimodal-LLM baselines (pyhazards.prompted, SmokeBench protocol). Pillow decodes the FIgLib
# frames and OpenCV draws the numbered grid overlay exactly as the SmokeBench authors' script does.
prompted = ["pillow>=9.1", "opencv-python-headless>=4.8"]
# Open-weight backends (Qwen2.5-VL, InternVL3-*-hf, Idefics2). InternVL3 -hf checkpoints need transformers
# 4.52+; transformers 5 needs torchvision for the Qwen2.5-VL processor (install the build matching torch).
prompted-hf = ["pillow>=9.1", "opencv-python-headless>=4.8", "transformers>=4.52", "accelerate>=0.26", "torchvision"]
# Closed backends through the official clients; API keys come from the environment only.
prompted-gemini = ["pillow>=9.1", "opencv-python-headless>=4.8", "google-genai>=1.0"]
prompted-openai = ["pillow>=9.1", "opencv-python-headless>=4.8", "openai>=1.0"]

[project.urls]
Homepage = "https://labrai.github.io/PyHazards/"
Repository = "https://github.com/LabRAI/PyHazards"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyhazards*"]
