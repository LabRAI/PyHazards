model_name: urbanfloodcast
display_name: UrbanFloodCast
hazard: Flood
catalog_status: experimental
source_file: pyhazards/models/urbanfloodcast.py
builder_name: urbanfloodcast_builder
summary: >
  A four-layer convolutional inundation baseline under the UrbanFloodCast name; not the published deep
  neural operator (experimental).
description:
  - >
    ``urbanfloodcast`` is a small PyHazards 2-D convolutional network that maps ``(batch, history, channels,
    H, W)`` rasters to a next-step depth raster. It is not UrbanFloodCast: the published model is a deep
    neural operator (U-NO / Fourier layers, 4,470,437 parameters for DNO-3) that predicts 24 steps at
    once, with transfer-learning variants, on simulated design storms for two areas of Berlin
    (Zenodo 10.5281/zenodo.15700880, CC BY 4.0).
  - >
    The official code has no licence, so a faithful port must be rewritten from the paper (its U-NO and
    FNO components come from BSD-2 / MIT projects). The smoke configuration scores this placeholder on
    ``flood_inundation_synthetic`` (random rasters).
paper:
  title: "Urban flood modeling and forecasting with deep neural operator and transfer learning"
  url: https://doi.org/10.1016/j.jhydrol.2025.133705
  repo_url: https://github.com/HydroPML/UrbanFloodCast
references:
  - title: "Urban flood modeling and forecasting with deep neural operator and transfer learning"
    url: https://doi.org/10.1016/j.jhydrol.2025.133705
    repo_url: https://github.com/HydroPML/UrbanFloodCast
    note: >
      Xu, De Vos, Shi, Rüther, Bronstert and Zhu, Journal of Hydrology 661:133705 (2025). The
      repository (no licence) holds the DNO models and training scripts.
tasks:
  - regression
  - segmentation
example: |
  import torch
  from pyhazards.models import build_model

  model = build_model(name="urbanfloodcast", task="regression", in_channels=3, history=4)
  preds = model(torch.randn(2, 4, 3, 16, 16))
  print(preds.shape)
notes:
  - "Outputs are next-horizon inundation depth rasters."
  - >
    Experimental: kept under its published name only until a reimplementation from the paper replaces
    it; do not report its results as UrbanFloodCast's.
smoke_test:
  task: regression
  build_kwargs:
    in_channels: 3
    history: 4
    base_channels: 32
  input:
    kind: tensor
    tensor:
      shape: [2, 4, 3, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
