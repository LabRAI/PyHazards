model_name: swin_unetr
display_name: SwinUNETR
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/swin_unetr.py
builder_name: swin_unetr_builder
summary: >
  Swin-Transformer encoder with a convolutional U-Net decoder (MONAI's SwinUNETR), configured by
  default as TS-SatFire's spatio-temporal (3D) reference model for next-day fire progression.
description:
  - >
    ``swin_unetr`` is SwinUNETR (Hatamizadeh et al., BrainLes 2021): a four-stage Swin Transformer
    with shifted-window attention and patch merging encodes the input, and its five feature
    levels feed a convolutional U-Net decoder of residual blocks. The implementation is MONAI's
    (1.3.2, Apache-2.0; the authors' official code uses it), ported to plain PyTorch with MONAI's module
    names, so MONAI state dicts load with ``strict=True``; MONAI's ``"merging"`` /
    ``"mergingv2"`` patch merging and SwinUNETR-v2 blocks (``use_v2``) are included.
  - >
    With the defaults (``spatial_dims=3``) the model is TS-SatFire's SwinUNETR-3D, which modifies
    MONAI's file: patches of (1, 2, 2) and attention windows of (T, 4, 4), so every window spans
    the whole time series; patch merging that only merges even-sized dimensions (with T = 6 the
    first stage halves time to 3 and later stages keep it); optional Swin-V2 attention
    (``attn_version="v2"``); feature size 36, batch norm and two-class logits averaged over time.
    ``spatial_dims=2`` gives TS-SatFire's SwinUNETR-2D, which is stock MONAI (patch 2, window 7,
    feature size 48).
paper:
  title: "Swin UNETR: Swin Transformers for Semantic Segmentation of Brain Tumors in MRI Images"
  url: https://arxiv.org/abs/2201.01266
  repo_url: https://github.com/Project-MONAI/research-contributions
references:
  - title: "TS-SatFire: A Multi-Task Satellite Image Time-Series Dataset for Wildfire Detection and Prediction"
    url: https://doi.org/10.1038/s41597-025-06271-3
    repo_url: https://github.com/zhaoyutim/TS-SatFire
    note: >
      SwinUNETR-3D from the repository's modified MONAI copy (patch (1, 2, 2), window (T, 4, 4),
      even-dimension patch merging, window attention "v1", feature size 36) on 256x256 tiles of
      daily VIIRS and auxiliary data, 43 channels for next-day progression prediction, T in
      {2, 4, 6}, logits averaged over time; prediction trained with Dice + weighted CE (1:1, class
      weights [1, 446.78]), learning rate 0.001, batch 8 (paper text). The number of heads (a
      command-line argument) is not published. Paper Table 3 (6 input days; arXiv 2412.11555):
      33.2M parameters, F1 0.797 / 0.855 / 0.374 and IoU 0.688 / 0.768 / 0.331 on active fire /
      burned area / prediction; Table 4 (seeds 42-44): prediction F1 0.371 +/- 0.003, IoU
      0.332 +/- 0.003; Table 5 (prediction, T = 6 / 4 / 2): F1 0.374 / 0.354 / 0.366. SwinUNETR-2D
      (stock MONAI, feature size 48) has 25.2M parameters and F1 0.774 / 0.829 on active fire /
      burned area.
reproduction:
  reference_code: https://github.com/Project-MONAI/MONAI
  reference_commit: "1.3.2"
  reference_license: Apache-2.0
  reference_config: >
    TS-SatFire's SwinUNETR(image_size=(T, H, W), patch_size=(1, 2, 2), window_size=(T, 4, 4),
    in_channels=43, out_channels=2, depths=(2, 2, 2, 2), num_heads=(3, 3, 3, 3), feature_size=36,
    norm_name="batch", attn_version="v1") from spatial_models/swinunetr/ at da75732 (an adapted
    MONAI SwinUNETR; the repository has no license and is used only as a test oracle), with its
    outputs averaged over time, at T = 6 (and T = 2, 3, 4 for the other merging plans) on 32x32
    tiles, at (6, 256, 256) for the parameter count (33,191,942), and with attn_version="v2"; MONAI
    1.3.2 SwinUNETR(spatial_dims=2, in_channels=8, feature_size=48, norm_name="batch") for the 2D
    baseline (25,151,996 parameters, forward at 64x64); and 2D/3D MONAI configurations with
    "merging" and "mergingv2", use_v2, instance norm, dropout, attention dropout, stochastic
    depth, gradient checkpointing and unnormalised features.
  parameter_count: 33191942
  checks: [parameter_count, initialization, state_dict, forward]
  oracle_test: tests/oracle/test_swin_unetr_oracle.py
  deviations:
    - >
      TS-SatFire's autoregressive attention (``attn_version="ar"``, AutoregressiveAttention.py,
      a causal temporal mask on Swin-V2 attention) is not ported: the prediction script hard-codes
      ``attn_version="v1"``. The temporal mask TS-SatFire computes in every 3D stage is only used
      by that attention, so it is not computed here either.
    - >
      TS-SatFire's number of heads (``-nh``) is not published; the default 3 per stage is a
      PyHazards choice. Table 3's 33.2M is consistent with any of 3, 4, 6 or 12 heads (33.19M to
      33.23M with 43 channels; 33.15M to 33.19M with 8).
    - >
      TS-SatFire averages the 3D logits over time in its training script; here that read-out is
      part of the model (``time_reduction="mean"``), which also takes ``(batch, time, channels,
      H, W)`` instead of ``(batch, channels, time, H, W)``.
    - >
      ``downsample`` takes ``"merging"``, ``"mergingv2"`` or ``"ts_satfire"`` but not a custom
      module, and MONAI's ``load_from`` helper for its self-supervised Swin-ViT checkpoint is not
      ported (state dicts load directly).
    - >
      Gradient checkpointing follows MONAI; TS-SatFire's copy calls its block with the wrong
      number of arguments when ``use_checkpoint=True``. Swin-V2 attention with a window size of 1
      (division by zero in the reference) and inputs that do not fit the merging plan fixed by
      ``img_size`` (a concatenation error in the reference) raise ValueError.
tasks:
  - segmentation
example: |
  import torch
  from pyhazards.models import build_model

  # TS-SatFire SwinUNETR-3D prediction model for 6 days of 43 channels on 256x256 tiles.
  model = build_model(name="swin_unetr", task="segmentation", in_channels=43, history=6)
  logits = model(torch.randn(1, 6, 43, 256, 256))  # (batch, days, channels, H, W)
  print(logits.shape)  # (1, 2, 256, 256)

  # TS-SatFire's single-image SwinUNETR-2D (stock MONAI).
  model_2d = build_model(name="swin_unetr", task="segmentation", in_channels=8, spatial_dims=2)
  print(model_2d(torch.randn(1, 8, 256, 256)).shape)  # (1, 2, 256, 256)
notes:
  - "With downsample='ts_satfire' the merging plan is fixed by img_size = (history, image_size, image_size): a stage merges a dimension only if its size there is even (T = 6: time 6 -> 3 at the first stage; T = 4: 4 -> 2 -> 1; T = 2: 2 -> 1; odd T: never)."
  - "Height and width must be multiples of 32 (patch 2 times four merges); MONAI's merging modes also halve time four times, so they need T divisible by 16."
  - "TS-SatFire's Swin-V2 attention normalises its 3D relative coordinates with [:, :, :, i] indexing, which in 3D scales entries of the width axis rather than each coordinate; this is kept."
  - "MONAI quirks are kept: the 3D 'merging' mode concatenates two of the eight neighbours twice and two never, and window attention indexes its bias table with [:n, :n] when a window is shrunk to the feature size."
  - "num_heads may be one int for every stage, as in TS-SatFire's scripts."
