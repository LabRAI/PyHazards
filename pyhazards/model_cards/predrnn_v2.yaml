model_name: predrnn_v2
display_name: PredRNN-v2
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/predrnn_v2.py
builder_name: predrnn_v2_builder
summary: >
  A compact PredRNN-v2-style wildfire baseline over raster history windows.
description:
  - >
    ``predrnn_v2`` is a recurrent raster-history baseline for wildfire sequence forecasting.
  - >
    It gives the PyHazards wildfire suite a lightweight proxy for memory-augmented next-frame wildfire prediction.
paper:
  title: "Sim2Real-Fire: A Multi-Modal Simulation Dataset for Forecast and Backtracking of Real-World Forest Fire"
  url: https://openreview.net/forum?id=H1x4DwwRzC
tasks:
  - segmentation
  - regression
example: |
  import torch
  from pyhazards.models import build_model
  
  model = build_model(name="predrnn_v2", task="segmentation", history=4, in_channels=8)
  logits = model(torch.randn(2, 4, 8, 16, 16))
  print(logits.shape)
notes:
  - "The smoke path uses a short wildfire raster history and returns a one-channel prediction map."
smoke_test:
  task: segmentation
  build_kwargs:
    history: 4
    in_channels: 8
  input:
    kind: tensor
    tensor:
      shape: [2, 4, 8, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
