model_name: fourcastnet_tc
display_name: FourCastNet TC Adapter
hazard: Tropical Cyclone
catalog_status: experimental
source_file: pyhazards/models/fourcastnet_tc.py
builder_name: fourcastnet_tc_builder
summary: >
  Experimental placeholder for FourCastNet-based cyclone forecasts: a two-layer MLP over generic
  storm-history features. It contains no FourCastNet component, forecast fields, weights or tracker.
description:
  - >
    FourCastNet (Pathak et al., arXiv 2202.11214) is an adaptive Fourier neural operator (AFNO) model of
    20 global ERA5 fields at 0.25 degrees; storms are followed by tracking pressure minima in its forecast
    fields (the paper shows Hurricane Michael as a case study).
  - >
    The PyHazards ``fourcastnet_tc`` module is a two-layer MLP over a generic ``(batch, history, features)``
    sequence returning ``(batch, horizon, 3)``, scored only on synthetic data. A faithful version is a
    pipeline (forecast fields, tracker, scoring against ``ibtracs_tracks``).
paper:
  title: "FourCastNet: A Global Data-driven High-resolution Weather Model using Adaptive Fourier Neural Operators"
  url: https://arxiv.org/abs/2202.11214
  repo_url: https://github.com/NVlabs/FourCastNet
tasks:
  - regression
example: |
  import torch
  from pyhazards.models import build_model

  model = build_model(name="fourcastnet_tc", task="regression", input_dim=8, history=6, horizon=5)
  preds = model(torch.randn(2, 6, 8))
  print(preds.shape)
notes:
  - "Not faithful (experimental): no FourCastNet forecast fields, weights or tracker are involved."
  - "The cited paper is an arXiv preprint; the peer-reviewed companion is Kurth et al., PASC '23, doi:10.1145/3592979.3593412. The NVlabs repository (BSD-3-Clause) is frozen; maintained checkpoints and runners are NVIDIA earth2studio / PhysicsNeMo (nvidia/fourcastnet1, Apache-2.0). TCBench evaluates FourCastNet v2 (SFNO), a different model."
smoke_test:
  task: regression
  build_kwargs:
    input_dim: 8
    history: 6
    horizon: 5
    output_dim: 3
  input:
    kind: tensor
    tensor:
      shape: [2, 6, 8]
  expected_output:
    kind: tensor
    shape: [2, 5, 3]
