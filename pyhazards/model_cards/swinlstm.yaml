model_name: swinlstm
display_name: SwinLSTM
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/swinlstm.py
builder_name: swinlstm_builder
summary: >
  A compact SwinLSTM-style wildfire sequence baseline over raster histories.
description:
  - >
    ``swinlstm`` combines a short wildfire raster history with a windowed recurrent mixing block.
  - >
    It serves as the PyHazards proxy for SwinLSTM-style spatio-temporal wildfire forecasting baselines.
paper:
  title: "Sim2Real-Fire: A Multi-Modal Simulation Dataset for Forecast and Backtracking of Real-World Forest Fire"
  url: https://openreview.net/forum?id=H1x4DwwRzC
tasks:
  - segmentation
  - regression
example: |
  import torch
  from pyhazards.models import build_model
  
  model = build_model(name="swinlstm", task="segmentation", history=4, in_channels=8, window_size=4)
  logits = model(torch.randn(2, 4, 8, 16, 16))
  print(logits.shape)
notes:
  - "The smoke path uses a short wildfire raster history and returns a one-channel prediction map."
smoke_test:
  task: segmentation
  build_kwargs:
    history: 4
    in_channels: 8
    window_size: 4
  input:
    kind: tensor
    tensor:
      shape: [2, 4, 8, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
