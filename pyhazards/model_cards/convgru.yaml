model_name: convgru
display_name: ConvGRU
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/convgru.py
builder_name: convgru_builder
summary: >
  Convolutional GRU (Ballas et al., ICLR 2016) with a convolutional head on the last hidden state:
  the Conv-GRU baseline that FireCastNet trained for seasonal burned-area prediction.
description:
  - >
    ``convgru`` runs a stack of convolutional GRU cells over a ``(batch, time, channels, height,
    width)`` sequence and maps the hidden state of the last time step to per-pixel logits with a
    ``Conv2d`` head. Each cell follows Ballas et al.: one convolution over ``[x_t, h_{t-1}]``
    gives the update and reset gates, a second convolution over ``[x_t, r * h_{t-1}]`` gives the
    candidate, and ``h_t = (1 - z) * h_{t-1} + z * tanh(candidate)``.
  - >
    The default is the Conv-GRU baseline of FireCastNet (Michail et al., Scientific Reports 2025),
    as in its ``configs/conv-gru-config.yaml``: 11 SeasFire variables, one layer of 128 hidden
    channels, 5x5 kernels, a dense 64x64 logit map trained with BCE on every pixel. FireCastNet's
    code has no license, so the module is written from the equations; it is checked against
    FireCastNet's ``ConvGRUSeg``, whose state dicts load with ``strict=True``, and gives identical
    outputs and seeded initial weights.
paper:
  title: "Delving Deeper into Convolutional Networks for Learning Video Representations"
  url: https://arxiv.org/abs/1511.06432
references:
  - title: "FireCastNet: Earth-as-a-Graph for Seasonal Fire Prediction"
    url: https://doi.org/10.1038/s41598-025-30645-7
    repo_url: https://github.com/SeasFire/firecastnet
    note: >
      Conv-GRU baseline (arXiv:2502.01550). SeasFire datacube (0.25 degree, 8-day steps), 11
      inputs (mslp, tp, vpd, sst, t2m_mean, ssrd, swvl1, lst_day, ndvi, pop_dens and the land-sea
      mask), binary burned area (gwis_ba) h periods ahead, years 2002-2017 / 2018 / 2019 for
      training / validation / testing, BCE, AdamW lr 1e-3. Global test AUPRC with 24 input steps
      (Table 2): 0.593 / 0.579 / 0.556 / 0.551 / 0.545 / 0.569 for h = 1 / 2 / 4 / 8 / 16 / 24;
      with 12 steps (Figure 3) 0.624 / 0.614 / 0.604 / 0.593 / 0.582 / 0.579, the best Conv-GRU
      setting, and with 6 steps 0.604 / 0.597 / 0.586 / 0.571 / 0.560 / 0.557. FireCastNet scores
      0.641 at h = 1 with 24 steps.
  - title: "A Nationwide Benchmark for Wildfire Initial Attack Failure Prediction with Public Environmental Data (WildfireIA)"
    url: https://arxiv.org/abs/2606.15529
    repo_url: https://github.com/LabRAI/WildfireIA
    note: >
      Same cell, different model. WildfireIA's ConvGRU baseline (train.py ConvGRUClassifier at
      aba9be9, MIT) is one cell with 64 channels and 3x3 kernels on 29x29 event patches, read out
      by global pooling and an MLP to one score. Initial-attack failure prediction: AUPRC 41.2 +/-
      1.6, AUROC 84.1 +/- 0.6 (Table 3); containment duration: MAE 36.4 h (Table 6).
reproduction:
  reference_code: https://github.com/SeasFire/firecastnet
  reference_commit: dc0d131be7f0638e3a84c16817e7bc9be454e53e
  reference_license: none (no LICENSE file; seasfire/backbones/conv_gru.py is used only as the test oracle, not copied)
  reference_config: >
    configs/conv-gru-config.yaml: ConvGRULit(input_dim_grid_nodes 11, hidden_layers 1, hidden_dim
    128, kernel_size [5, 5]) -> ConvGRUSeg(..., num_classes=1), 64x64 patches, checked on
    (batch, 12, 11, 64, 64) inputs, also with all-zero (padding) steps; the paper's 64 hidden
    channels (361,793 parameters); a three-layer model with two classes (outputs and input
    gradients).
  parameter_count: 1337985
  checks: [parameter_count, initialization, state_dict, forward]
  oracle_test: tests/oracle/test_convgru_oracle.py
  deviations:
    - >
      The reference looks for all-zero (padding) time steps and, if there are any, re-indexes the
      per-step outputs passed to the next layer with a batch-sized index (giving a
      ``(batch, batch, ...)`` tensor). This never changes the output of the one-layer model and
      breaks deeper ones. The port does not look for padding: padded steps update the state, as
      they do in the one-layer reference.
    - >
      The head's padding is ``(kernel - 1) // 2`` per dimension; the reference uses the first
      kernel dimension for both, which only differs for non-square kernels.
    - >
      Only ``task="segmentation"`` exists: the reference maps a sequence to one map of logits and
      has no frames-to-frames form. The ConvGRU baseline of Shi et al. (2017), a frame forecaster
      with a different cell (reset gate after the state convolution, leaky ReLU), is
      ``build_model("trajgru", task="forecasting", layer_type="ConvGRU")``.
tasks:
  - segmentation
example: |
  import torch
  from pyhazards.models import build_model

  # FireCastNet's Conv-GRU: 12 eight-day steps of 11 standardised SeasFire variables on 64x64 patches.
  model = build_model(name="convgru", task="segmentation")  # 1,337,985 parameters
  x = torch.randn(2, 12, 11, 64, 64)  # (batch, time, variables, lat, lon)
  logits = model(x)  # (2, 1, 64, 64); train with BCEWithLogitsLoss on every pixel
  print(logits.shape)

  # The paper's size: one hidden layer of 64 channels.
  small = build_model(name="convgru", task="segmentation", hidden_dim=64)  # 361,793 parameters
notes:
  - >
    Paper and code differ, and the code is followed. Hidden size: the paper (Sec. 5.1) gives the
    Conv-GRU "a single hidden layer with 64 hidden units" (also ConvGRULit's default), the
    configuration file 128 (the default here; ``hidden_dim=64`` gives the paper's size). Equations:
    the paper writes the candidate as ``tanh(W_xh * x + r . (W_hh * h) + b)``, reset gate after the
    state convolution, while the code, like Ballas et al. (Eq. 7), applies it before:
    ``tanh(W * [x, r . h])``. Read-out: the paper describes a (2r+1)x(2r+1) grid around each
    location and MLP layers that reduce it to one prediction; the code predicts a dense 64x64 map
    with a 5x5 convolution and BCE over all pixels. Training: the paper uses AdamW, lr 1e-3, SGDR
    (cycles of 10 and 40 epochs) and weight decay 1e-7; the configuration file lr 1e-3, weight
    decay 1e-8, gradient clipping 0.5, 50 epochs, 12 input steps and a target shift of 16.
  - >
    Input layout and preprocessing: ConvGRULit permutes SeasFire batches from ``(B, C, T, H, W)``
    to ``(B, T, C, H, W)``, the layout used here. Variables are prepared by FireCastNet's data
    module (log1p for tp and pop_dens, standardisation; see the ``firecastnet`` card).
