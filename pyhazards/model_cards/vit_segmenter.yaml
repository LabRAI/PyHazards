model_name: vit_segmenter
display_name: ViT Segmenter
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/vit_segmenter.py
builder_name: vit_segmenter_builder
summary: >
  A compact ViT-style wildfire sequence segmenter over raster histories.
description:
  - >
    ``vit_segmenter`` gives the wildfire catalog a lightweight vision-transformer segmentation baseline over short temporal windows.
  - >
    It complements SegFormer and Swin-Unet with a simpler transformer-style dense-prediction proxy.
paper:
  title: "TS-SatFire: A wildfire progression benchmark from temporally dense satellite sequences"
  url: https://doi.org/10.1038/s41597-025-06271-3
tasks:
  - segmentation
  - regression
example: |
  import torch
  from pyhazards.models import build_model
  
  model = build_model(name="vit_segmenter", task="segmentation", history=4, in_channels=8)
  logits = model(torch.randn(2, 4, 8, 16, 16))
  print(logits.shape)
notes:
  - "The smoke path uses a short wildfire raster history and returns a one-channel prediction map."
smoke_test:
  task: segmentation
  build_kwargs:
    history: 4
    in_channels: 8
  input:
    kind: tensor
    tensor:
      shape: [2, 4, 8, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
