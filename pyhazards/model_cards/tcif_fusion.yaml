model_name: tcif_fusion
display_name: TCIF-fusion
hazard: Tropical Cyclone
catalog_status: experimental
source_file: pyhazards/models/tcif_fusion.py
builder_name: tcif_fusion_builder
summary: >
  Experimental generic storm-history network registered under the TCIF-fusion name; it is not the
  knowledge-guided intensity model of Wang et al. (2024) and has not been checked against it.
description:
  - >
    TCIF-fusion (Wang, Li and Zheng, Environmental Research Letters 2024) forecasts the 24-hour intensity
    of Northwest Pacific typhoons by fusing five inputs: ERA5 3D wind fields, sea surface temperature,
    GridSat-B1 infrared imagery, the best-track history and Grad-CAM "model knowledge" heat maps (about 300
    million parameters in the official Keras notebook). It does not forecast tracks.
  - >
    The PyHazards ``tcif_fusion`` module splits a generic ``(batch, history, features)`` vector into two
    halves, fuses two small encoders and returns ``(batch, horizon, 3)`` track-and-intensity values; it has
    none of the paper's inputs and is scored only on synthetic data (``tc_tracks_synthetic``). It is kept as
    an experimental adapter until it is replaced by a port of the paper's model.
paper:
  title: Tropical cyclone intensity forecasting using model knowledge guided deep learning model
  url: https://doi.org/10.1088/1748-9326/ad1bde
  repo_url: https://github.com/wangchong96/TCIF-fusion
tasks:
  - regression
example: |
  import torch
  from pyhazards.models import build_model

  model = build_model(name="tcif_fusion", task="regression", input_dim=8, horizon=5)
  preds = model(torch.randn(2, 6, 8))
  print(preds.shape)
notes:
  - "Not faithful (experimental): the original fuses ERA5 3D winds, SST, infrared imagery, best-track history and Grad-CAM heat maps for 24-hour intensity only; this module is a generic network on synthetic inputs."
  - "Citation: Wang, Li and Zheng, Environmental Research Letters 19, 024006 (2024), doi:10.1088/1748-9326/ad1bde (open access, CC BY 4.0)."
  - "The official notebooks have no LICENSE file and do not run as released (data loading is missing and the validation inputs are mis-specified)."
smoke_test:
  task: regression
  build_kwargs:
    input_dim: 8
    horizon: 5
    output_dim: 3
  input:
    kind: tensor
    tensor:
      shape: [2, 6, 8]
  expected_output:
    kind: tensor
    shape: [2, 5, 3]
