model_name: earthformer
display_name: EarthFormer
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/earthformer.py
builder_name: earthformer_builder
summary: >
  A compact EarthFormer-style wildfire sequence baseline over raster histories.
description:
  - >
    ``earthformer`` gives the wildfire catalog a lightweight space-time transformer-style sequence model.
  - >
    PyHazards keeps it aligned with the shared wildfire raster-history contract used for spread-style benchmarking.
paper:
  title: "Sim2Real-Fire: A Multi-Modal Simulation Dataset for Forecast and Backtracking of Real-World Forest Fire"
  url: https://openreview.net/forum?id=H1x4DwwRzC
tasks:
  - segmentation
  - regression
example: |
  import torch
  from pyhazards.models import build_model
  
  model = build_model(name="earthformer", task="segmentation", history=4, in_channels=8)
  logits = model(torch.randn(2, 4, 8, 16, 16))
  print(logits.shape)
notes:
  - "The smoke path uses a short wildfire raster history and returns a one-channel prediction map."
smoke_test:
  task: segmentation
  build_kwargs:
    history: 4
    in_channels: 8
  input:
    kind: tensor
    tensor:
      shape: [2, 4, 8, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
