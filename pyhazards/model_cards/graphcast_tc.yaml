model_name: graphcast_tc
display_name: GraphCast TC Adapter
hazard: Tropical Cyclone
catalog_status: experimental
source_file: pyhazards/models/graphcast_tc.py
builder_name: graphcast_tc_builder
summary: >
  Experimental placeholder for GraphCast-based cyclone forecasts: a small transformer over generic
  storm-history features. It contains no GraphCast component, forecast fields, weights or tracker.
description:
  - >
    GraphCast (Lam et al., Science 2023) is a global medium-range weather model (a graph neural network on
    a multi-mesh, 0.25 degree ERA5 grid); its cyclone results come from running the model and tracking
    storms in the forecast fields with a re-implementation of ECMWF's tracker (Science Supplement 8.1),
    scored against IBTrACS.
  - >
    The PyHazards ``graphcast_tc`` module is a small transformer over a generic ``(batch, history,
    features)`` sequence returning ``(batch, horizon, 3)``, scored only on synthetic data. A faithful
    version is a pipeline (forecast fields, tracker, scoring against ``ibtracs_tracks``), not a module of
    this shape.
paper:
  title: Learning skillful medium-range global weather forecasting
  url: https://doi.org/10.1126/science.adi2336
  repo_url: https://github.com/google-deepmind/weathernext
tasks:
  - regression
example: |
  import torch
  from pyhazards.models import build_model

  model = build_model(name="graphcast_tc", task="regression", input_dim=8, horizon=5)
  preds = model(torch.randn(2, 6, 8))
  print(preds.shape)
notes:
  - "Not faithful (experimental): no GraphCast forecast fields, weights or tracker are involved."
  - "Citation: Lam et al., Learning skillful medium-range global weather forecasting, Science 382(6677), 1416-1421 (2023), doi:10.1126/science.adi2336; preprint arXiv 2212.12794 titled 'GraphCast: Learning skillful medium-range global weather forecasting'."
  - "github.com/google-deepmind/graphcast now redirects to google-deepmind/weathernext; the GraphCast code is in weathernext/weathernext1_graph ('WeatherNext 1 Graph'), and git tag v0.1.1 (97d1ad50b0b7af4aaed7790167dffa769bae1f2c) is the last self-contained graphcast package. Code: Apache-2.0. Weights: CC BY-NC-SA 4.0 until 2026-08-06, CC BY 4.0 since per the README (the license string inside the checkpoints still reads CC BY-NC-SA 4.0). GenCast (Price et al., Nature 2024) is a separate model."
  - "PyPI 'graphcast' is an unrelated package."
smoke_test:
  task: regression
  build_kwargs:
    input_dim: 8
    horizon: 5
    output_dim: 3
  input:
    kind: tensor
    tensor:
      shape: [2, 6, 8]
  expected_output:
    kind: tensor
    shape: [2, 5, 3]
