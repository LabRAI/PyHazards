model_name: attention_unet
display_name: Attention U-Net
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/attention_unet.py
builder_name: attention_unet_builder
summary: >
  An attention-gated U-Net baseline for wildfire raster prediction.
description:
  - >
    ``attention_unet`` extends the encoder-decoder wildfire baseline with lightweight gating on skip connections.
  - >
    PyHazards keeps it public because attention-augmented U-Net variants appear frequently in wildfire progression comparisons.
paper:
  title: "TS-SatFire: A wildfire progression benchmark from temporally dense satellite sequences"
  url: https://doi.org/10.1038/s41597-025-06271-3
tasks:
  - segmentation
  - regression
example: |
  import torch
  from pyhazards.models import build_model
  
  model = build_model(name="attention_unet", task="segmentation", in_channels=12)
  logits = model(torch.randn(2, 12, 16, 16))
  print(logits.shape)
notes:
  - "The smoke path uses a single wildfire raster snapshot and returns a one-channel prediction map."
smoke_test:
  task: segmentation
  build_kwargs:
    in_channels: 12
  input:
    kind: tensor
    tensor:
      shape: [2, 12, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
