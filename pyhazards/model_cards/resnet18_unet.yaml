model_name: resnet18_unet
display_name: ResNet18 U-Net
hazard: Wildfire
catalog_status: core
source_file: pyhazards/models/resnet18_unet.py
builder_name: resnet18_unet_builder
summary: >
  A residual U-Net wildfire baseline for raster spread prediction.
description:
  - >
    ``resnet18_unet`` keeps the U-Net decoding path while using residual feature extraction blocks for wildfire rasters.
  - >
    It matches the wildfire benchmark family used in WildfireSpreadTS-style sequence-to-map comparisons.
paper:
  title: "WildfireSpreadTS: A Dataset of Multi-Modal Time Series for Wildfire Spread Prediction"
  url: https://openreview.net/forum?id=RgdGkPRQ03
tasks:
  - segmentation
  - regression
example: |
  import torch
  from pyhazards.models import build_model
  
  model = build_model(name="resnet18_unet", task="segmentation", in_channels=12)
  logits = model(torch.randn(2, 12, 16, 16))
  print(logits.shape)
notes:
  - "The smoke path uses a single wildfire raster snapshot and returns a one-channel prediction map."
smoke_test:
  task: segmentation
  build_kwargs:
    in_channels: 12
  input:
    kind: tensor
    tensor:
      shape: [2, 12, 16, 16]
  expected_output:
    kind: tensor
    shape: [2, 1, 16, 16]
