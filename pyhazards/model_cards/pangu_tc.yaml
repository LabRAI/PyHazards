model_name: pangu_tc
display_name: Pangu TC Adapter
hazard: Tropical Cyclone
catalog_status: experimental
source_file: pyhazards/models/pangu_tc.py
builder_name: pangu_tc_builder
summary: >
  Experimental placeholder for Pangu-Weather-based cyclone forecasts: a small network over generic
  storm-history features. It contains no Pangu-Weather component, forecast fields, weights or tracker.
description:
  - >
    Pangu-Weather (Bi et al., Nature 2023) is a 3D Earth-specific transformer for global medium-range
    forecasts; its cyclone results come from tracking storms in the forecast fields (technical report
    arXiv 2211.02556, Sec. 4.2.2), compared with ECMWF-HRES.
  - >
    The PyHazards ``pangu_tc`` module is a small network over a generic ``(batch, history, features)``
    sequence returning ``(batch, horizon, 3)``, scored only on synthetic data. A faithful version is a
    pipeline (ONNX forecasts, tracker, scoring against ``ibtracs_tracks``).
paper:
  title: Accurate medium-range global weather forecasting with 3D neural networks
  url: https://doi.org/10.1038/s41586-023-06185-3
  repo_url: https://github.com/198808xc/Pangu-Weather
tasks:
  - regression
example: |
  import torch
  from pyhazards.models import build_model

  model = build_model(name="pangu_tc", task="regression", input_dim=8, horizon=5)
  preds = model(torch.randn(2, 6, 8))
  print(preds.shape)
notes:
  - "Not faithful (experimental): no Pangu-Weather forecast fields, weights or tracker are involved."
  - "Licensing: the official repository has no code licence (only ONNX inference scripts and pseudocode are released), and the trained weights are CC BY-NC-SA 4.0 with commercial use forbidden. A PyHazards pipeline would have to download them at runtime, never bundle them, and state the non-commercial terms; Apache-2.0 runners exist (ECMWF ai-models-panguweather, NVIDIA earth2studio)."
  - "Technical details and the cyclone tracking protocol are in the technical report arXiv 2211.02556."
smoke_test:
  task: regression
  build_kwargs:
    input_dim: 8
    horizon: 5
    output_dim: 3
  input:
    kind: tensor
    tensor:
      shape: [2, 6, 8]
  expected_output:
    kind: tensor
    shape: [2, 5, 3]
