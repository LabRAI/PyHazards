model_name: hurricast
display_name: Hurricast
hazard: Tropical Cyclone
catalog_status: experimental
source_file: pyhazards/models/hurricast.py
builder_name: hurricast_builder
summary: >
  Experimental generic storm-history LSTM registered under the Hurricast name; it is not the
  Hurricast model of Boussioux et al. (2022) and has not been checked against it.
description:
  - >
    Hurricast (Boussioux et al., Weather and Forecasting 2022) forecasts 24-hour track displacement and
    intensity from three modalities: statistical best-track features, ERA5 reanalysis maps encoded by a
    CNN / GRU or Transformer encoder-decoder, and XGBoost on the concatenated embeddings and features.
  - >
    The PyHazards ``hurricast`` module is a 2-layer LSTM over a generic ``(batch, history, features)``
    sequence that returns ``(batch, horizon, 3)``; it has no reanalysis encoder, no XGBoost stage and none
    of the paper's inputs, and it is scored only on synthetic data (``tc_tracks_synthetic``). It is kept as
    an experimental adapter until it is replaced by a port of the paper's model.
paper:
  title: "Hurricane Forecasting: A Novel Multimodal Machine Learning Framework"
  url: https://doi.org/10.1175/WAF-D-21-0091.1
  repo_url: https://github.com/leobix/hurricast
tasks:
  - regression
example: |
  import torch
  from pyhazards.models import build_model

  model = build_model(
      name="hurricast",
      task="regression",
      input_dim=8,
      horizon=5,
      output_dim=3,
  )

  preds = model(torch.randn(2, 6, 8))
  print(preds.shape)
notes:
  - "Not faithful (experimental): the original predicts 24-hour track displacement and intensity with XGBoost on statistical features plus CNN/GRU or Transformer embeddings of ERA5 maps; this module is a generic LSTM on synthetic inputs."
  - "Citation: Boussioux, Zeng, Guenais and Bertsimas, Weather and Forecasting 37(6), 817-831 (2022), doi:10.1175/WAF-D-21-0091.1; preprint arXiv 2011.06125."
  - "The official repository has no LICENSE file (its README claims MIT and links a LICENSE that does not exist); its released GRU decoder preset also differs from the paper's (bidirectional, last state only)."
smoke_test:
  task: regression
  build_kwargs:
    input_dim: 8
    horizon: 5
    output_dim: 3
  input:
    kind: tensor
    tensor:
      shape: [2, 6, 8]
  expected_output:
    kind: tensor
    shape: [2, 5, 3]
