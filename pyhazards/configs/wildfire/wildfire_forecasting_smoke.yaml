benchmark:
  name: wildfire
  hazard_task: wildfire.danger
  metrics:
    - accuracy
    - macro_f1
    - auc
    - pr_auc
  eval_split: test
dataset:
  name: wildfire_danger_synthetic
  params:
    micro: true
    access_mode: temporal
    history: 10
    channels: 25
model:
  name: wildfire_forecasting
  task: classification
  params:
    variant: lstm
    input_dim: 25
report:
  output_dir: reports/wildfire_forecasting
  formats:
    - json
seed: 7
