# FireCastNet smoke run on synthetic rasters. The real model forecasts burned-area presence on the
# global 0.25-degree SeasFire grid (24 x 11 x 720 x 1440 inputs); here a tiny global grid
# (2.5 degree, 72 x 144) with icosphere levels 0-2 stands in, scored with the spread-mask metrics.
benchmark:
  name: wildfire
  hazard_task: wildfire.spread
  metrics:
    - iou
    - f1
    - burned_area_mae
  eval_split: test
dataset:
  name: wildfire_spread_temporal_synthetic
  params:
    micro: true
    history: 4
    channels: 6
    height: 72
    width: 144
model:
  name: firecastnet
  task: segmentation
  params:
    in_channels: 6
    timeseries_len: 4
    mesh_levels: [0, 1, 2]
    sp_res: 2.5
    max_lat: 88.75
    min_lat: -88.75
    max_lon: 178.75
    min_lon: -178.75
    hidden_dim: 32
    embed_cube_dim: 32
    processor_layers: 4
report:
  output_dir: reports/firecastnet
  formats:
    - json
seed: 7
