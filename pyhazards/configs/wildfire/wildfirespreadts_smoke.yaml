benchmark:
  name: wildfire
  hazard_task: wildfire.spread
  metrics:
    - average_precision
    - iou
    - f1
    - burned_area_mae
  eval_split: test
dataset:
  name: wildfire_spread_temporal_synthetic
  params:
    micro: true
model:
  name: wildfirespreadts
  task: segmentation
  params:
    baseline: utae
    history: 4
    in_channels: 6
report:
  output_dir: reports/wildfirespreadts
  formats:
    - json
seed: 7
