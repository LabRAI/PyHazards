benchmark:
  name: wildfire
  hazard_task: wildfire.spread
  metrics:
    - iou
    - f1
    - burned_area_mae
  eval_split: test
dataset:
  name: wildfire_spread_synthetic
  params:
    micro: true
    channels: 6
    height: 64
    width: 64
model:
  name: asufm
  task: segmentation
  params:
    in_channels: 6
report:
  output_dir: reports/asufm
  formats:
    - json
seed: 7
