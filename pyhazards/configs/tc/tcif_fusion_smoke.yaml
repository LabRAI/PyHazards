# Smoke run of a reduced TCIF-fusion (same graph, small grids and widths) on random inputs in its layout; the
# paper's model has 25 x 25 ERA5 grids, 224 x 224 IR images and about 300 M parameters.
benchmark:
  name: tc
  hazard_task: tc.intensity
  metrics:
    - intensity_mae
    - intensity_rmse
    - intensity_mae_group_mean
  eval_split: test
dataset:
  name: tcif_fusion_synthetic
  params:
    micro: true
    grid_size: 9
    ir_size: 32
model:
  name: tcif_fusion
  task: regression
  params:
    grid_size: 9
    ir_size: 32
    widths: [4, 8, 8]
    vgg_filters: [4, 4, 8, 8, 8]
    vgg_fc: 16
report:
  output_dir: reports/tcif_fusion
  formats:
    - json
seed: 7
