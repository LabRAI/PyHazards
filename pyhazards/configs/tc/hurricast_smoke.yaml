# Smoke run of Hurricast's encoder-decoder head on random inputs in the hurricast_ibtracs_era5 layout. The full
# model (XGBoost on the embeddings) must be fitted first (Hurricast.fit); scores on synthetic data mean nothing.
benchmark:
  name: tc
  hazard_task: tc.intensity
  metrics:
    - intensity_mae
    - intensity_rmse
    - intensity_mae_group_mean
  eval_split: test
dataset:
  name: hurricast_synthetic
  params:
    micro: true
model:
  name: hurricast
  task: regression
  params:
    target: intensity
    predictor: network
report:
  output_dir: reports/hurricast
  formats:
    - json
seed: 7
