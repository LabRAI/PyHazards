# EQTransformer (paper model, randomly initialised) on synthetic 60-s windows, scored with the
# EQTransformer protocol (Mousavi et al. 2020: TP if |dt| < 0.5 s) plus detection metrics.
benchmark:
  name: earthquake
  hazard_task: earthquake.picking
  metrics:
    - p_f1
    - s_f1
    - p_pick_mae
    - s_pick_mae
    - detection_f1
  eval_split: test
  params:
    protocol: eqtransformer
dataset:
  name: earthquake_waveforms_synthetic
  params:
    micro: true
model:
  name: eqtransformer
  task: picking
  params:
    in_channels: 3
report:
  output_dir: reports/earthquake_eqtransformer
  formats:
    - json
seed: 7
