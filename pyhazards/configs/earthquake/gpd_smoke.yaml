# GPD (randomly initialised) slid over synthetic windows (stride 10 samples), scored with the
# EQTransformer protocol (TP if |dt| < 0.5 s), under which Mousavi et al. (2020) compared GPD.
benchmark:
  name: earthquake
  hazard_task: earthquake.picking
  metrics:
    - p_f1
    - s_f1
    - p_pick_mae
    - s_pick_mae
  eval_split: test
  params:
    protocol: eqtransformer
dataset:
  name: earthquake_waveforms_synthetic
  params:
    micro: true
model:
  name: gpd
  task: picking
  params:
    in_channels: 3
report:
  output_dir: reports/earthquake_gpd
  formats:
    - json
seed: 7
