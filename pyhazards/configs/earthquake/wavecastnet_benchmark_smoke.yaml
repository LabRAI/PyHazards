# WaveCastNet (dense, randomly initialised) on synthetic point-source wavefields (not real data): a 32 x 24
# grid, 6 input frames and 6 forecast frames, produced by two rolling calls of 3 frames like the official
# validation forecast. Scored with the official ACC / RFNE / RMSE per (sequence, channel).
benchmark:
  name: earthquake
  hazard_task: earthquake.forecasting
  metrics:
    - acc
    - rfne
    - rmse
  eval_split: test
  params:
    seed: 0
    rollout_step: 3
dataset:
  name: earthquake_wavefield_synthetic
  params:
    micro: true
model:
  name: wavecastnet
  task: forecasting
  params:
    variant: dense
    in_channels: 3
    height: 32
    width: 24
    future_seq: 3
report:
  output_dir: reports/earthquake_forecasting
  formats:
    - json
seed: 7
