# HydroGraphNet (not yet a faithful port) on synthetic mesh-node water depths, scored per node.
benchmark:
  name: flood
  hazard_task: flood.inundation
  metrics:
    - pixel_mae
    - iou
    - f1
  eval_split: test
dataset:
  name: flood_mesh_synthetic
  params:
    micro: true
model:
  name: hydrographnet
  task: regression
  params:
    node_in_dim: 2
    edge_in_dim: 3
    out_dim: 1
report:
  output_dir: reports/flood
  formats:
    - json
seed: 7
