# Google's MeanEmbeddingForecastLSTM in the PyHazards streamflow layout (config "streamflow": one shared
# input group, lead_time 0, smaller hidden size) on synthetic basins, scored by the CMAL mixture mean.
benchmark:
  name: flood
  hazard_task: flood.streamflow
  metrics:
    - nse
    - kge
  eval_split: test
dataset:
  name: flood_streamflow_synthetic
  params:
    micro: true
model:
  name: google_flood_forecasting
  task: regression
  params:
    config: streamflow
    n_dynamic: 5
    n_static: 27
    seq_length: 30
    hidden_size: 64
report:
  output_dir: reports/google_flood_forecasting
  formats:
    - json
seed: 7
