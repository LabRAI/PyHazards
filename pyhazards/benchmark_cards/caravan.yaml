slug: caravan
display_name: Caravan
kind: ecosystem
hazard_family: Flood
benchmark_key: flood
support_status: real-backed
summary: >
  Caravan, the global large-sample hydrology dataset, read from a local copy and scored with the
  per-basin streamflow metrics.
description:
  - >
    ``caravan_streamflow`` reads the official Caravan layout (per-basin netCDF or CSV time series and
    attribute CSVs) into NeuralHydrology-style samples; the ``flood.streamflow`` evaluator then reports
    per-basin NSE, KGE and the other NeuralHydrology metrics, summarised by the median and mean over basins.
  - >
    Caravan has no fixed benchmark split: choose inputs, basins and periods for the experiment. Google's
    FloodHub model was trained on Caravan with the MultiMet forecast products (not read by PyHazards).
    The smoke configs exercise the same contract on synthetic basins.
source:
  title: "Caravan - A global community dataset for large-sample hydrology"
  url: https://doi.org/10.1038/s41597-023-01975-w
  repo_url: https://github.com/kratzert/Caravan
tasks:
  - flood.streamflow
metrics:
  - nse
  - kge
  - nse_mean
smoke_configs:
  - pyhazards/configs/flood/neuralhydrology_lstm_smoke.yaml
  - pyhazards/configs/flood/google_flood_forecasting_smoke.yaml
linked_models:
  - neuralhydrology_lstm
  - neuralhydrology_ealstm
  - google_flood_forecasting
notes:
  - The reader is checked against NeuralHydrology's Caravan dataset on real Caravan basin files.
