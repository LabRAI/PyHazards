slug: ibtracs
display_name: IBTrACS
kind: ecosystem
hazard_family: Tropical Cyclone
benchmark_key: tc
support_status: real-backed
summary: >
  Best-track ground truth from NOAA NCEI's IBTrACS v04 for track and intensity forecasts scored by
  the shared tropical cyclone evaluator.
description:
  - >
    ``ibtracs_tracks`` reads IBTrACS v04 CSV or netCDF files with PyHazards' reader and builds
    forecasting windows (history of six-hourly observations, targets at the requested lead times) for any
    agency's winds and pressures.
  - >
    No ported model consumes IBTrACS directly yet: Hurricast (which uses IBTrACS with ERA5) and the
    weather-model cyclone pipelines (forecast fields, tracker, scoring against IBTrACS) are pending.
source:
  title: IBTrACS
  url: https://www.ncei.noaa.gov/products/international-best-track-archive
tasks:
  - tc.track_intensity
metrics:
  - track_error_km
  - intensity_mae
  - pressure_mae
smoke_configs: []
linked_models: []
