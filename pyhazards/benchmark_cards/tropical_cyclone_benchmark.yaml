slug: tropical_cyclone_benchmark
display_name: Tropical Cyclone Benchmark
kind: family
hazard_family: Tropical Cyclone
benchmark_key: tc
support_status: real-backed
summary: >
  Shared PyHazards evaluator for tropical cyclone forecasts: great-circle track error in km and
  intensity errors in the dataset's units, per lead time, plus single-lead intensity regression.
description:
  - >
    ``tc.track_intensity`` scores forecasts of position, maximum wind and central pressure at the
    dataset's lead times: great-circle track error (km; ``track_distance: tcn_equirectangular`` gives
    TropiCycloneNet's 111 km-per-degree formula), wind MAE in the dataset's unit (knots for IBTrACS, m/s
    for TCND) and pressure MAE (hPa), each per lead time and averaged. Models with several samples per
    storm are scored on the sample mean and with the best-of-k errors of the TropiCycloneNet paper (per
    lead time and per variable, the smallest error among the samples).
  - >
    ``tc.intensity`` scores one intensity (or 24-hour intensity change) per storm and time: MAE and RMSE
    in the dataset's unit, per test year when the split names years, and their unweighted mean, the way
    Xu et al. (2021) and SAF-Net report results.
  - >
    Real data: ``ibtracs_tracks`` (IBTrACS best tracks), ``tropicyclonenet_dataset`` (TCND) and
    ``ships_xu2021`` (SHIPS predictors). The smoke configs run on synthetic data with the same layouts.
tasks:
  - tc.track_intensity
  - tc.intensity
metrics:
  - track_error_km
  - intensity_mae
  - pressure_mae
  - best_of_k_track_error_km
  - best_of_k_intensity_mae
  - best_of_k_pressure_mae
  - intensity_rmse
  - intensity_mae_group_mean
smoke_configs:
  - pyhazards/configs/tc/tropicalcyclone_mlp_smoke.yaml
  - pyhazards/configs/tc/saf_net_smoke.yaml
  - pyhazards/configs/tc/tropicyclonenet_smoke.yaml
  - pyhazards/configs/tc/hurricast_smoke.yaml
  - pyhazards/configs/tc/tcif_fusion_smoke.yaml
  - pyhazards/configs/tc/graphcast_tc_smoke.yaml
  - pyhazards/configs/tc/pangu_tc_smoke.yaml
  - pyhazards/configs/tc/fourcastnet_tc_smoke.yaml
linked_models:
  - tropicalcyclone_mlp
  - saf_net
  - tropicyclonenet
  - hurricast
  - tcif_fusion
  - graphcast_tc
  - pangu_tc
  - fourcastnet_tc
notes:
  - "Smoke configs use synthetic datasets (tc_tracks_synthetic, ships_xu2021_synthetic, safnet_cma_era_interim_synthetic, tropicyclonenet_dataset_synthetic); their scores mean nothing. Benchmark results carry synthetic=True for them."
  - "hurricast, tcif_fusion and the GraphCast / Pangu-Weather / FourCastNet adapters are experimental generic stand-ins, not the published models."
