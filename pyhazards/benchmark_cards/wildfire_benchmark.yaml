slug: wildfire_benchmark
display_name: Wildfire Benchmark
kind: family
hazard_family: Wildfire
benchmark_key: wildfire
support_status: synthetic-backed
summary: >
  Shared PyHazards evaluator family for wildfire danger and wildfire spread experiments.
description:
  - >
    The wildfire benchmark family is the single scoring layer for tabular and daily-sequence
    danger tasks, weekly forecasting tasks, and raster spread tasks.
  - >
    Current coverage is synthetic-backed, but it already exposes a single hazard-level
    evaluator contract across wildfire danger and wildfire spread smoke configs.
tasks:
  - wildfire.danger
  - wildfire.spread
metrics:
  - accuracy
  - macro_f1
  - auc
  - pr_auc
  - mae
  - rmse
  - average_precision
  - iou
  - f1
  - burned_area_mae
smoke_configs:
  - pyhazards/configs/wildfire/wildfire_danger_smoke.yaml
  - pyhazards/configs/wildfire/wildfire_forecasting_smoke.yaml
  - pyhazards/configs/wildfire/asufm_smoke.yaml
  - pyhazards/configs/wildfire/wildfire_spread_smoke.yaml
  - pyhazards/configs/wildfire/wildfirespreadts_smoke.yaml
  - pyhazards/configs/wildfire/forefire_smoke.yaml
  - pyhazards/configs/wildfire/wrf_sfire_smoke.yaml
  - pyhazards/configs/wildfire/firecastnet_smoke.yaml
linked_models:
  - wildfire_fpa
  - wildfire_forecasting
  - random_forest
  - xgboost
  - deep_ensemble
  - asufm
  - wildfire_aspp
  - wildfirespreadts
  - logistic_regression
  - resnet18_unet
  - convlstm
  - utae
  - segformer
  - swin_unet
  - attention_unet
  - ts_satfire
  - unet3d
  - unetr
  - swin_unetr
  - tcn
  - earthformer
  - unet
  - deeplabv3
  - earthfarseer
  - rainformer
  - forefire
  - wrf_sfire
  - firecastnet
notes:
  - "WildfireSpreadTS is the public Appendix-A benchmark ecosystem surfaced on this page."
  - >
    The Kondylatos et al. (2022) tree baselines ``random_forest`` and ``xgboost`` read the same
    daily danger tensors as ``wildfire_forecasting`` but must be fitted (``model.fit``) before
    they are scored, so they have no smoke config; pass the fitted model to
    ``BenchmarkRunner.run(model=...)``. ``deep_ensemble`` wraps any of the linked models (the
    ten-LSTM danger ensemble of Kondylatos et al. 2025, or U-TAE members for spread).
  - >
    FireCastNet forecasts seasonal burned-area presence on the SeasFire datacube (AUPRC in its
    paper); without a SeasFire adapter its smoke config runs on synthetic rasters and is scored
    with the spread-mask metrics.
  - >
    Earthfarseer and Rainformer are frame-sequence forecasters (Sim2Real-Fire baselines); their
    task="segmentation" adaptation maps the first predicted frame to fire-mask logits, which is a
    PyHazards convention, not a published Sim2Real-Fire configuration.
  - >-
    Prithvi-EO-2.0 BurnScars and Prithvi-EO-2.0-TL segment burn scars after a fire (post-fire
    burned-area mapping). They are wildfire models but are not linked here, because this family
    scores danger and spread prediction, not post-fire mapping.
