slug: earthquake_forecast_synthetic
display_name: Synthetic Wavefield Sequences
hazard_family: Earthquake
source_role: Synthetic Smoke Data
summary: Synthetic dense-grid wavefield sequences for wavefield-forecasting smoke runs. Not real data.
provider: Generated locally by PyHazards (pyhazards/datasets/earthquake/synthetic.py)
geometry: Dense-grid wavefield tensors
spatial_resolution: Not applicable (synthetic grid)
temporal_resolution: Short history and forecast windows
update_cadence: Generated on load
period_of_record: Not applicable (synthetic)
coverage: Not applicable (synthetic)
formats: PyTorch tensors via the dataset registry
overview:
  - >
    This dataset is synthetic: moving Gaussian blobs over sinusoidal backgrounds on a small grid,
    split into history and future frames. It only exercises the ``earthquake.forecasting`` path
    (``wavecastnet``) in CI. It used to be registered a second time as ``aefa_forecast``; AEFA is an
    unrelated earthquake-occurrence forecasting dataset, so that name was removed.
data_characteristics:
  - "Inputs ``(n, channels, temporal_in, height, width)``, targets ``(n, channels, temporal_out, height, width)``."
typical_use_cases:
  - WaveCastNet smoke tests.
access_links:
  - label: Generator source
    url: https://github.com/LabRAI/PyHazards/blob/main/pyhazards/datasets/earthquake/synthetic.py
inspection: null
registry:
  name: earthquake_forecast_synthetic
  example: |
    from pyhazards.datasets import load_dataset

    data = load_dataset("earthquake_forecast_synthetic", micro=True, temporal_in=5, temporal_out=4).load()
    train = data.get_split("train")
    print(train.inputs.shape, train.targets.shape)
references:
  - citation: "PyHazards synthetic wavefield generator (no external source)."
    url: https://github.com/LabRAI/PyHazards/blob/main/pyhazards/datasets/earthquake/synthetic.py
pyhazards_usage:
  - Used by ``wavecastnet_benchmark_smoke.yaml``.
related_models:
  - wavecastnet
related_benchmarks:
  - earthquake_benchmark
