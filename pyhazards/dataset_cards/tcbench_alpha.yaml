slug: tcbench_alpha
display_name: TCBench Alpha
hazard_family: Tropical Cyclone
source_role: Track Benchmark
summary: Weather-model cyclone tracks (Pangu-Weather, FourCastNet v2, AIFS; 2023) matched to IBTrACS, with the raw forecast fields they were tracked in; read by pyhazards.forecasts at a pinned revision.
provider: TCBench project (Gomez et al.), MIT-licensed code and data on the Hugging Face Hub (TCBench/TCBench)
geometry: Storm-track tables and global gridded forecast fields
spatial_resolution: 0.25-degree global fields; track points on that grid
temporal_resolution: Six-hourly forecast steps to 120 h, initialised at 00 and 12 UTC
update_cadence: Static release (PyHazards pins revision 0124d14d)
period_of_record: 2023 forecasts (TCBench's test year)
coverage: Global tropical cyclones present in IBTrACS
formats: CSV track tables (matched_tracks, unmatched_tracks) and netCDF4 forecast fields (about 3 GB per forecast)
overview:
  - >
    TCBench provides data-processing tools, evaluation protocols and baselines to compare tropical cyclone
    forecasts: tracks extracted from numerical and data-driven weather models with TempestExtremes are
    matched with IBTrACS best tracks and scored by lead time.
  - >
    ``pyhazards.forecasts.tcbench`` reads the released ``matched_tracks`` and ``unmatched_tracks`` files
    and, with HTTP range requests, only the variables a tracker needs from the raw forecast files.
    ``pyhazards.forecasts.tempest`` reproduces TCBench's TempestExtremes tracks from those fields byte for
    byte, and ``score_forecast_tracks(..., protocol="tcbench")`` its evaluation.
data_characteristics:
  - "matched_tracks/2023_<model>.csv: SID, Initial Time, Valid Time, wind max (m/s in the released files), pressure min (Pa), lat, lon."
  - "unmatched_tracks: TempestExtremes StitchNodes CSV per forecast (track_id, time, grid indices, lon, lat, slp, wind10)."
  - "neural_weather_models: int16-packed netCDF4 fields (msl, u10, v10, t2m and u, v, z, t, q on 13 levels for Pangu-Weather) for lead times 6-120 h."
  - "TCBench's evaluation reads IBTrACS LAT / LON as float16, which shifts its position errors by up to several km; the tcbench protocol reproduces this."
typical_use_cases:
  - Scoring weather-model cyclone tracks against IBTrACS with TCBench's protocol.
  - Re-tracking published weather-model forecasts with other trackers (e.g. the ECMWF-style tracker of the Pangu-Weather and GraphCast papers).
access_links:
  - label: TCBench Alpha repository
    url: https://github.com/msgomez06/TCBench_Alpha
  - label: TCBench data on the Hugging Face Hub
    url: https://huggingface.co/datasets/TCBench/TCBench
inspection: null
registry: null
primary_references:
  - citation: "Gomez, M. et al. (2026). TCBench: A Benchmark for Tropical Cyclone Track and Intensity Forecasting at the Global Scale. arXiv:2601.23268."
    url: https://arxiv.org/abs/2601.23268
  - citation: TCBench Alpha (repository and documentation)
    url: https://github.com/msgomez06/TCBench_Alpha
pyhazards_usage:
  - >
    Not a registered dataset: the tracks are forecasts, not training data. Use
    ``pyhazards.forecasts.read_tcbench_matched_tracks`` / ``read_tcbench_fields`` and score with
    ``pyhazards.forecasts.score_forecast_tracks`` against IBTrACS (see the Foundation Weather Models page).
related_models: []
related_benchmarks:
  - tropical_cyclone_benchmark
  - tcbench_alpha
notes:
  - The repository and the Hugging Face dataset are MIT-licensed (Copyright (c) 2023 Milton Gomez).
  - The Pangu-Weather forecasts derive from weights licensed CC BY-NC-SA 4.0 (non-commercial use only).
  - TCBench's "FourCastNet v2" is NVIDIA's SFNO-small, not the FourCastNet (AFNO) of Pathak et al. 2022.
