slug: tcbench_alpha
display_name: TCBench Alpha
hazard_family: Tropical Cyclone
source_role: Track Benchmark
summary: Benchmark platform matching forecast cyclone tracks from numerical and ML weather models with IBTrACS; documented as an external reference, with no PyHazards loader.
provider: TCBench project (Gomez et al.), MIT-licensed code; track files on the Hugging Face Hub
geometry: Storm-track history sequences
spatial_resolution: Storm-centre positions extracted from forecast fields
temporal_resolution: Six-hourly forecast tracks
update_cadence: Maintained by the TCBench project
period_of_record: Depends on the forecast archive (e.g. 2023 matched tracks)
coverage: Global tropical cyclones present in IBTrACS
formats: CSV track tables (matched_tracks) and Python evaluation tools
overview:
  - >
    TCBench provides data-processing tools, evaluation protocols and baselines to compare tropical cyclone
    forecasts: tracks extracted from numerical and data-driven weather models (with TempestExtremes) are
    matched with IBTrACS best tracks and scored by lead time.
  - >
    PyHazards does not load TCBench. An earlier ``tcbench_alpha`` dataset generated random numbers under
    this name and was removed; none of the PyHazards cyclone models was evaluated on TCBench in its paper.
data_characteristics:
  - Forecast tracks with position, maximum wind and minimum pressure matched to IBTrACS storms.
typical_use_cases:
  - Comparing weather-model cyclone forecasts (e.g. Pangu-Weather, FourCastNet v2) against best tracks.
access_links:
  - label: TCBench Alpha repository
    url: https://github.com/msgomez06/TCBench_Alpha
  - label: TCBench data on the Hugging Face Hub
    url: https://huggingface.co/datasets/TCBench/TCBench
inspection: null
registry: null
primary_references:
  - citation: TCBench Alpha (repository and documentation)
    url: https://github.com/msgomez06/TCBench_Alpha
pyhazards_usage:
  - >
    Not loadable from PyHazards. Score matched forecast tracks against ``ibtracs_tracks`` with the ``tc``
    benchmark instead.
related_models: []
related_benchmarks:
  - tropical_cyclone_benchmark
