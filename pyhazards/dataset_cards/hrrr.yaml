slug: hrrr
display_name: HRRR
hazard_family: Shared Forcing
source_role: Weather Forecast
summary: NOAA's 3 km, hourly updated, convection-allowing forecast model for the United States, archived on AWS since July 2014.
provider: NOAA (run operationally by NCEP; developed by the NOAA Global Systems Laboratory)
geometry: Gridded forecast fields
spatial_resolution: 3 km
temporal_resolution: Hourly forecast output; with HRRRv4 (since 2 December 2020) 18-hour forecasts every hour and 48-hour forecasts at 00, 06, 12 and 18 UTC
update_cadence: Every hour for CONUS; every 3 hours for Alaska
period_of_record: AWS archive from 30 July 2014; operational since 30 September 2014
coverage: Conterminous United States; an Alaska domain from July 2018
formats: GRIB2 with .idx index files
overview:
  - >
    The High-Resolution Rapid Refresh is NOAA's operational convection-allowing model. It is run
    every hour and produces short-range forecasts of near-surface and upper-air weather at 3 km.
  - >
    Its near-surface temperature, humidity, wind and precipitation forecasts are a common source of
    short-range fire-weather inputs; since HRRRv4 it also predicts wildfire smoke inline.
data_characteristics:
  - >
    Forecast length changed with the model version: 15 hours until 2016, 18 hours from about
    September 2016, 36 hours at the synoptic cycles from mid-2018 and 48 hours from December 2020.
  - >
    Files are grouped into surface (wrfsfc), pressure-level (wrfprs), native-level (wrfnat) and
    sub-hourly (wrfsubh) products; AWS keys look like hrrr.YYYYMMDD/conus/hrrr.tHHz.wrfsfcfFF.grib2.
  - The first two months on AWS predate operations and some early surface files are missing.
typical_use_cases:
  - Short-range fire-weather covariates (wind, humidity, temperature) for wildfire models.
  - Smoke forecast fields from HRRRv4 onwards.
access_links:
  - label: NOAA HRRR on the AWS Registry of Open Data
    url: https://registry.opendata.aws/noaa-hrrr-pds/
  - label: NOAA Rapid Refresh / HRRR information page
    url: https://rapidrefresh.noaa.gov/hrrr/
pyhazards_usage:
  - >
    PyHazards does not load this source; it is listed as an external reference for short-range
    weather forecasts.
primary_references:
  - citation: "Dowell et al. (2022). The High-Resolution Rapid Refresh (HRRR): An Hourly Updating Convection-Allowing Forecast Model. Part I: Motivation and System Description. Weather and Forecasting 37(8), 1371-1395."
    url: https://doi.org/10.1175/WAF-D-21-0151.1
related_models: []
related_benchmarks: []
notes:
  - >
    Terms: NOAA Open Data Dissemination states that the data "are open to the public and can be
    used as desired", requests attribution and forbids implying NOAA endorsement.
