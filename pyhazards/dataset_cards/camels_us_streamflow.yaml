slug: camels_us_streamflow
display_name: CAMELS-US
hazard_family: Flood
source_role: Streamflow Benchmark
summary: Reader for a local copy of CAMELS-US (671 US catchments, daily forcings, USGS streamflow and catchment attributes) in the setup of Kratzert et al. (2019), as NeuralHydrology reads it.
provider: NCAR / USGS CAMELS data set (Newman et al. 2015; Addor et al. 2017), read by PyHazards from a local copy
geometry: Daily basin time series with static attributes
spatial_resolution: Catchment averages (one series per gauge)
temporal_resolution: Daily
update_cadence: Static research dataset (extended Maurer forcings released separately in 2019)
period_of_record: 1980-2014
coverage: 671 catchments in the contiguous United States (531 in the Kratzert et al. 2019 benchmark)
formats: Whitespace-separated forcing and streamflow text files; ';'-separated attribute tables
overview:
  - >
    CAMELS-US provides basin-averaged daily meteorological forcings (Daymet, Maurer, NLDAS), USGS
    streamflow and catchment attributes (Newman et al., HESS 2015; Addor et al., HESS 2017; CC BY 4.0, Zenodo 15529996). Kratzert et al.
    (HESS 2019) used 531 of its basins with the extended Maurer forcings (daily minimum and maximum
    temperature added; HydroShare, doi 10.4211/hs.17c896843cf940339c3c3496d0c1c077) and 27 attributes,
    the standard benchmark for the NeuralHydrology models.
  - >
    ``camels_us_streamflow`` reads that layout like NeuralHydrology's ``CamelsUS`` dataset (discharge from
    cubic feet per second to mm/day with the area of the forcing-file header, negative values to NaN) and
    builds streamflow samples. Defaults are the paper's: forcings ``maurer_extended``, inputs prcp, srad,
    tmax, tmin, vp, the 27 attributes, 270-day windows, train 1999-10-01 to 2008-09-30 and test
    1989-10-01 to 1999-09-30 (validation 1980-10-01 to 1989-09-30, from NeuralHydrology's example
    configuration). PyHazards downloads nothing.
data_characteristics:
  - "Layout: ``basin_mean_forcing/<forcing>/[<huc>/]<basin>_*_forcing_leap.txt``, ``usgs_streamflow/[<huc>/]<basin>_streamflow_qc.txt``, ``camels_attributes_v2.0/camels_*.txt``."
  - Target ``QObs(mm/d)``; with several forcing products the input columns get a ``_<forcing>`` suffix.
  - Normalisation and sample selection as for Caravan (training statistics; training samples with missing inputs or targets dropped; every evaluation day kept).
typical_use_cases:
  - Reproducing the Kratzert et al. (2019) LSTM and EA-LSTM benchmark.
  - Per-basin NSE / KGE / FHV / FMS / FLV evaluation with the flood benchmark (``flood.streamflow``).
access_links:
  - label: CAMELS (NCAR RAL)
    url: https://ral.ucar.edu/solutions/products/camels
  - label: CAMELS time series and attributes (Zenodo)
    url: https://zenodo.org/records/15529996
  - label: Extended Maurer forcings (HydroShare)
    url: https://www.hydroshare.org/resource/17c896843cf940339c3c3496d0c1c077
  - label: NeuralHydrology data prerequisites
    url: https://neuralhydrology.readthedocs.io/en/latest/tutorials/data-prerequisites.html
inspection: null
registry:
  name: camels_us_streamflow
  example: |
    from pyhazards.datasets import load_dataset

    # The 531 basins of Kratzert et al. (2019), e.g. NeuralHydrology's 531_basin_list.txt.
    data = load_dataset("camels_us_streamflow", data_dir="/data/CAMELS_US", basins="531_basin_list.txt").load()
    inputs, y = data.get_split("test").inputs[0]
    print(inputs["x_d"].shape, inputs["x_s"].shape, y.shape)  # (270, 5) (27,) (270, 1)
primary_references:
  - citation: "Addor, Newman, Mizukami and Clark (2017). The CAMELS data set: catchment attributes and meteorology for large-sample studies. HESS 21:5293-5313."
    url: https://doi.org/10.5194/hess-21-5293-2017
  - citation: "Kratzert et al. (2019). Towards learning universal, regional, and local hydrological behaviors via machine learning applied to large-sample datasets. HESS 23:5089-5110."
    url: https://doi.org/10.5194/hess-23-5089-2019
    repo_url: https://github.com/kratzert/ealstm_regional_modeling
pyhazards_usage:
  - Point ``data_dir`` at the CAMELS-US root (with ``basin_mean_forcing/maurer_extended`` added) and pass the basin list.
  - Score models with ``BenchmarkRunner`` on the ``flood`` benchmark (task ``flood.streamflow``).
related_models:
  - neuralhydrology_lstm
  - neuralhydrology_ealstm
related_benchmarks:
  - flood_benchmark
  - camels_us
notes:
  - The reader, scaler and samples are checked against NeuralHydrology's CamelsUS dataset on the real CAMELS-US test basins shipped with NeuralHydrology (oracle test), and the whole evaluation against NeuralHydrology's Tester.
