slug: nohrsc_snodas
display_name: SNODAS
hazard_family: Shared Forcing
source_role: Snow Analysis
summary: NOAA NOHRSC's daily 1 km snow analysis (snow water equivalent, depth, melt, sublimation) for the conterminous United States, distributed by NSIDC since 2003.
provider: NOAA NWS National Operational Hydrologic Remote Sensing Center (NOHRSC); distributed by NOAA@NSIDC as data set G02158
geometry: Regular latitude-longitude grid
spatial_resolution: 30 arc-seconds (nominally 1 km)
temporal_resolution: Daily; states are snapshots at 06 UTC, fluxes are 24-hour totals from 06 to 06 UTC
update_cadence: Daily
period_of_record: Masked files from 30 September 2003, unmasked files from 9 December 2009; NSIDC discourages use before October 2004
coverage: Masked version, conterminous United States and some Canadian basins (24.95-52.875 N, 124.733-66.942 W); unmasked version extends into Canada and Mexico
formats: Daily .tar files of gzipped flat binary 16-bit big-endian grids with text headers (NoData -9999)
overview:
  - >
    SNODAS is a modelling and data-assimilation system developed by NOHRSC to provide the best
    possible daily estimates of snow cover and related variables on a 1 km grid, in support of
    hydrologic modelling and analysis.
  - >
    For hazard work it describes snowpack and melt timing, which shape spring flood risk and the
    length of the fire season in snow-dominated mountains.
data_characteristics:
  - >
    Eight variables: snow water equivalent, snow depth, snowmelt runoff, snowpack sublimation,
    blowing-snow sublimation, solid and liquid precipitation, and snowpack average temperature.
  - >
    Known defects documented by NSIDC: snow water equivalent and depth wrongly zero in 126,950 cells
    from 9 October 2014 to 10 October 2019 (a repair mask is provided), values saturating at
    32.767 m, snowpack temperature missing before 21 February 2004 and a 5% cell shift on
    1 October 2013.
  - The unmasked version's coverage is not consistent until 2013.
typical_use_cases:
  - Snowmelt inputs for spring flood and streamflow models.
  - Snow-cover duration and melt timing as covariates of mountain fire seasons.
access_links:
  - label: NSIDC data set G02158
    url: https://nsidc.org/data/g02158/versions/1
  - label: NSIDC SNODAS file archive
    url: https://noaadata.apps.nsidc.org/NOAA/G02158/
pyhazards_usage:
  - >
    PyHazards does not load this source; it is listed as an external reference for snow state.
primary_references:
  - citation: National Operational Hydrologic Remote Sensing Center (2004). Snow Data Assimilation System (SNODAS) Data Products at NSIDC, Version 1. NSIDC.
    url: https://doi.org/10.7265/N5TB14TC
  - citation: Barrett (2003). National Operational Hydrologic Remote Sensing Center Snow Data Assimilation System (SNODAS) Products at NSIDC. NSIDC Special Report 11.
    url: https://nsidc.org/sites/default/files/nsidc_special_report_11.pdf
related_models: []
related_benchmarks: []
notes:
  - >
    Terms: NSIDC states "As a condition of using these data, you must cite the use of this data
    set" with the citation above.
