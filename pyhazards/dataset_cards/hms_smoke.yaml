slug: hms_smoke
display_name: NOAA HMS Smoke Polygons
hazard_family: Wildfire
source_role: Smoke Plumes
summary: Analyst-drawn smoke plume outlines from NOAA's Hazard Mapping System, produced daily since August 2005.
provider: NOAA NESDIS Office of Satellite and Product Operations (OSPO), Satellite Analysis Branch
geometry: Analyst-drawn smoke polygons
spatial_resolution: Vector polygons (WGS84); annual smoke-day rasters at 0.05 deg
temporal_resolution: Daily analyses, the first around 11:00-12:00 US Eastern time and usually a second around 19:00-20:00; each polygon has start and end times
update_cadence: Daily
period_of_record: 5 August 2005 to the present
coverage: North America, Hawaii and the Caribbean
formats: Zipped shapefiles (daily files and annual bundles), KML, annual GeoTIFF smoke-day rasters
overview:
  - >
    The Hazard Mapping System (HMS), first implemented in 2002, is NOAA's analyst-driven fire and
    smoke product: satellite analysts outline the smoke plumes visible in satellite imagery and
    record the satellite and the time window of each outline.
  - >
    The smoke polygons describe where smoke was visible, which fire detections and perimeters do
    not; they are commonly used to flag smoke-affected days and to link plumes to fires.
data_characteristics:
  - Attributes are Satellite, Start, End and Density (Light, Medium, Heavy or NA).
  - >
    The density attribute is consistently filled only from 1 June 2010; most earlier files have
    "NA" (apart from April-December 2008), so density-based analyses should start in mid-2010.
  - >
    File names and columns changed on 19 July 2022, when NOAA regenerated the historical archive;
    daily shapefiles are named hms_smokeYYYYMMDD.zip.
typical_use_cases:
  - Flagging smoke-affected days and regions in air-quality or wildfire impact studies.
  - Linking smoke plumes to fire detections and perimeters.
access_links:
  - label: NOAA OSPO Hazard Mapping System
    url: https://www.ospo.noaa.gov/products/land/hms.html
  - label: HMS smoke polygon archive (shapefile, KML, GeoTIFF)
    url: https://satepsanone.nesdis.noaa.gov/pub/FIRE/web/HMS/Smoke_Polygons/
pyhazards_usage:
  - >
    PyHazards does not load this source; it is listed as an external reference for wildfire
    smoke extent.
primary_references:
  - citation: Ruminski and Kondragunta (2006). Monitoring fire and smoke emissions with the hazard mapping system. Proc. SPIE 6412.
    url: https://doi.org/10.1117/12.694183
  - citation: Brey et al. (2018). Connecting smoke plumes to sources using Hazard Mapping System (HMS) smoke and fire location data over North America. Atmospheric Chemistry and Physics 18, 1745-1761.
    url: https://doi.org/10.5194/acp-18-1745-2018
related_models: []
related_benchmarks: []
