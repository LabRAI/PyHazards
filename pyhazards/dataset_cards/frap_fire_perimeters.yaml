slug: frap_fire_perimeters
display_name: CAL FIRE FRAP Fire Perimeters
hazard_family: Wildfire
source_role: Historical Perimeters
summary: California's historical wildfire perimeter archive, maintained by CAL FIRE's Fire and Resource Assessment Program, with fires back to 1878.
provider: CAL FIRE Fire and Resource Assessment Program (FRAP), with USFS Region 5, BLM, NPS, USFWS, California State Parks and contract counties
geometry: Fire perimeter polygons
spatial_resolution: Vector polygons (native coordinate system California Teale Albers, EPSG:3310)
temporal_resolution: One record per fire, with alarm and containment dates
update_cadence: Annual, each spring, adding the previous fire season (release firep25_1, April 2026)
period_of_record: 1878 to 2025 in release firep25_1
coverage: California
formats: File geodatabase; shapefile, GeoJSON, CSV, KML and GeoPackage exports from the California open-data hub
overview:
  - >
    The FRAP fire perimeter layer is CAL FIRE's statewide archive of mapped wildfire perimeters on
    public and private land in California, compiled with federal and local agencies and updated each
    spring with the previous fire season. Prescribed burns are kept in a separate layer.
  - >
    It is a long, regional perimeter record that complements the national incident feeds (WFIGS)
    and satellite detections (FIRMS) for California.
data_characteristics:
  - >
    Minimum mapped size for CAL FIRE and contract counties: at least 10 acres of timber, 50 acres of
    brush or 300 acres of grass, or at least 3 damaged or destroyed structures, or a fatality; other
    agencies submit perimeters of at least 10 acres. The criteria changed around 1991 and 2010.
  - >
    The archive is incomplete: some historical records were lost or too small for the cutoffs,
    some fires are duplicated or over-generalised, and unburned islands inside perimeters are
    mapped as burned. Perimeters may differ from those published by NIFC.
  - >
    Attributes include YEAR_, AGENCY, UNIT_ID, FIRE_NAME, INC_NUM, IRWINID, ALARM_DATE, CONT_DATE,
    CAUSE, C_METHOD, OBJECTIVE, GIS_ACRES and COMPLEX_NAME.
typical_use_cases:
  - Historical burned-area footprints for California wildfire studies.
  - Validating perimeters from national feeds or satellite products in California.
access_links:
  - label: California Fire Perimeters (all) on data.ca.gov
    url: https://data.ca.gov/dataset/california-fire-perimeters-all
  - label: California Natural Resources Agency open-data hub (downloads and services)
    url: https://gis.data.cnra.ca.gov/datasets/CALFIRE-Forestry::california-fire-perimeters-all
pyhazards_usage:
