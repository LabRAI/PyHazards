slug: hurricast_ibtracs_era5
display_name: Hurricast IBTrACS + ERA5 Inputs
hazard_family: Tropical Cyclone
source_role: Model Inputs (best track + reanalysis)
summary: "The inputs of Hurricast (Boussioux et al. 2022): 30 IBTrACS statistical features and nine storm-centred ERA5 maps per 3-hour step, 8 steps per sample, with the 24-hour intensity or position as target."
provider: NOAA NCEI (IBTrACS v04) and ECMWF / Copernicus Climate Change Service (ERA5), read from files the user provides
geometry: Storm-centred sequences of feature vectors and 25 x 25 one-degree maps
spatial_resolution: Storm-centre positions; maps 25 x 25 at 1 degree around the storm
temporal_resolution: Three-hourly steps (t-21 h ... t), 24-hour lead time
update_cadence: Follows the user's IBTrACS and ERA5 files
period_of_record: "Paper: 1980-2019 (train 1980-2011, validation 2012-2015, test 2016-2019)"
coverage: All IBTrACS basins (the paper reports test scores for the North Atlantic and Eastern Pacific)
formats: IBTrACS v04 CSV or netCDF; ERA5 pressure-level netCDF / zarr (or an xarray Dataset) with u, v, z at 225, 500, 700 hPa
overview:
  - >
    ``hurricast_ibtracs_era5`` builds Hurricast's samples. From IBTrACS (``read_ibtracs``) it keeps the rows
    on the 3-hour grid, interpolates the WMO wind and pressure linearly within each storm, and computes per
    step the 30 features of the official feature tables: latitude, longitude, WMO wind and pressure, distance
    to land, translation speed, cosine / sine of the day of year, direction, latitude and longitude, the
    Saffir-Simpson category value, one-hot basin and storm nature, and the latitude / longitude change since
    the previous step.
  - >
    Storms are selected like the official ``sort_storm``: kept when more than ``min_steps`` (20, i.e. 60 h)
    of their steps reach ``min_wind`` (34 kt), cut to start at the first such step and to at most
    ``max_steps`` (120) steps. Each window of 8 steps followed by 8 more gives a sample (windows whose target
    period has a step without any movement are dropped, as the official ``remove_zeros``). Winds of samples
    outside the North Atlantic and Eastern Pacific are converted from 10-minute to 1-minute values (/ 0.93).
  - >
    With ``era5=`` (a netCDF / zarr path or an ``xarray.Dataset`` with u, v and z, e.g. a Copernicus Climate
    Data Store download or the NCAR RDA copy) each step gets the nine maps u, v, z at 225, 500 and 700 hPa on
    the 25 x 25 one-degree grid centred on the grid point nearest to the storm (a 0.25-degree source is
    sampled at whole degrees). Maps are read only for samples of a split.
data_characteristics:
  - >
    Inputs per split: ``x_stat`` ``(N, 8, 30)``, ``x_viz`` ``(N, 8, 9, 25, 25)`` (channels u225, u500, u700,
    v..., z...; rows north to south) and ``position`` ``(N, 2)`` (latitude, longitude at the forecast time).
    Targets: ``target="intensity"`` the WMO wind 24 h ahead (1-minute kt, ``tc.intensity``);
    ``target="displacement"`` the position 24 h ahead ``(N, 1, 2)`` (``tc.track_intensity``).
  - >
    ``standardize=True`` standardises latitude, longitude, wind, pressure, distance to land, speed and the
    displacements (paper Table 2) and every map channel with the training split's statistics (recorded in
    the metadata); cyclic encodings and categories are left as they are.
  - >
    Splits by season (paper defaults: 1980-2011 / 2012-2015 / 2016-2019); the test split keeps only
    ``test_basins`` (NA, EP). The paper further restricts its test cases to those with ATCF operational
    forecasts (837 EP / 899 NA track cases), which needs the ATCF data and is not done here.
typical_use_cases:
  - Training and evaluating Hurricast (encoder-decoder embeddings and XGBoost) on real storms.
  - Multimodal (tabular + reanalysis map) 24-hour track and intensity forecasting experiments.
access_links:
  - label: IBTrACS v04r01 files (NOAA NCEI)
    url: https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/
  - label: ERA5 hourly data on pressure levels (Copernicus Climate Data Store)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-pressure-levels
  - label: ERA5 on NCAR RDA (ds633.0)
    url: https://rda.ucar.edu/datasets/ds633.0/
inspection: null
registry:
  name: hurricast_ibtracs_era5
  example: |
    from pyhazards.datasets import load_dataset

    data = load_dataset(
        "hurricast_ibtracs_era5",
        path="ibtracs.since1980.list.v04r01.csv",
        era5="era5_u_v_z_225_500_700.nc",   # covering the storms' 25 x 25 degree neighbourhoods
        target="intensity",
    ).load()
    train = data.get_split("train")
    print(train.inputs["x_stat"].shape, train.inputs["x_viz"].shape, train.targets.shape)
  notes:
    - "path= is an IBTrACS v04 CSV or netCDF file; era5= is optional (without it only the statistical inputs are built, enough for HUML-(stat, xgb))."
    - "min_wind, min_steps, max_steps, window_size, predict_at, the split seasons, test_basins and basins can be changed; the defaults are the paper's."
    - "The official per-step CDS requests (area latitude +-12.008, longitude +-12, 1-degree grid) are not reproduced; the maps are cut from the data the user provides."
references:
  - citation: "Boussioux, L., C. Zeng, T. Guenais and D. Bertsimas (2022). Hurricane Forecasting: A Novel Multimodal Machine Learning Framework. Weather and Forecasting 37(6), 817-831."
    url: https://doi.org/10.1175/WAF-D-21-0091.1
  - citation: "Knapp, K. R. et al. (2010). The International Best Track Archive for Climate Stewardship (IBTrACS). BAMS 91, 363-376; Gahtan, J. et al. (2024), IBTrACS v04r01, NOAA NCEI."
    url: https://doi.org/10.25921/82ty-9e16
  - citation: "Hersbach, H. et al. (2023). ERA5 hourly data on pressure levels from 1940 to present. Copernicus Climate Change Service (C3S) Climate Data Store."
    url: https://doi.org/10.24381/cds.bd0915c6
pyhazards_usage:
  - >
    Fit ``hurricast`` with ``model.fit(train.inputs, train.targets, val.inputs, val.targets)`` and score it
    with the ``tc`` benchmark: ``tc.intensity`` (MAE in kt) or ``tc.track_intensity`` with lead 24 h
    (great-circle error in km, the paper's haversine metric).
related_models:
  - hurricast
related_benchmarks:
  - tropical_cyclone_benchmark
  - ibtracs
notes:
  - >
    The official repository (no licence) did not release the code that built the paper's 30-feature tables,
    only their column names; the features are computed from the paper (Table 2, footnote 2) and those names,
    and the storm selection, interpolation, category and displacement columns are checked against the
    released src/utils/data_processing.py. Differences from that code: rows off the 3-hour grid (e.g.
    landfall records at 10:15) are dropped, WMO values are interpolated within each storm (the official
    numeric_data interpolates across the whole table, so a storm's first gaps take values from the previous
    storm), and spur tracks are skipped.
  - >
    Neither file is redistributed: IBTrACS follows the WDC-Meteorology open-access policy, ERA5 is CC BY 4.0
    (Copernicus). The tests use the 4-storm IBTrACS cut of tests/fixtures/ibtracs and a 9-time ERA5 cut around
    Hurricane Ophelia (tests/fixtures/era5).
