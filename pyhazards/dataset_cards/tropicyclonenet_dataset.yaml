slug: tropicyclonenet_dataset
display_name: TropiCycloneNet Dataset
hazard_family: Tropical Cyclone
source_role: Track Benchmark
summary: The TropiCycloneNet Dataset (TCND) of Huang et al. (2025) - best tracks, environmental features and ERA5 500 hPa geopotential for 3,630 storms in six basins - read in the layout of the official TropiCycloneNet loader.
provider: Huang et al. (authors of the TropiCycloneNet paper), Zenodo releases under CC BY 4.0
geometry: Storm-track history sequences
spatial_resolution: Storm-centre positions (0.1 degree); 20 x 20 degree ERA5 crops at 0.25 degree
temporal_resolution: Six-hourly
update_cadence: Static releases (Zenodo 15009527 dataset, 17104690 training data)
period_of_record: 1950-2023 (paper experiments 1950-2016 train / validation, 2017-2021 test)
coverage: Six basins (EP, NA, NI, SI, SP, WP)
formats: Tab-separated Data1d text files, pickled Env-Data .npy dicts, GPH .npy crops (and Data3d netCDF)
overview:
  - >
    TCND combines Data1d (best-track position, central pressure and 2-minute maximum wind, normalised),
    Data3d (ERA5 geopotential, wind and SST around the storm) and Env-Data (intensity class, motion,
    month, location bins, 12/24-hour motion direction, 24-hour intensity change). It is the training and
    test data of the TropiCycloneNet model.
  - >
    ``tropicyclonenet_dataset`` builds samples exactly like the official ``TrajectoryDataset`` and
    ``seq_collate`` (checked by an oracle test): windows of 8 observed and 4 future six-hourly steps, the
    observed track and its steps, Env-Data per observed step and 64 x 64 scaled 500 hPa geopotential
    frames; targets are the future latitude, longitude, pressure (hPa) and wind (m/s).
data_characteristics:
  - >
    Expected layout (the official loader's names under ``root``): ``BST_data/<area>/<train|val|test>/<AREA><YEAR>BST<NAME>.txt``,
    ``Env_data/<area>/<year>/<NAME>/<YYYYMMDDHH>.npy`` and ``ERA5_gph500/<area>/<year>/<NAME>/<YYYYMMDDHH>.npy``;
    the Zenodo training-data archives extract to ``bst_divi10_train_val_test_inlcude15_2023``,
    ``all_area_correct_location_includeunder15_2023`` and ``all_ocean_gph500_2023`` (pass them as
    ``data1d_dir``, ``env_dir`` and ``gph_dir``).
  - >
    Normalisation of Data1d: longitude = 5 x + 180 degrees east, latitude = 5 y, pressure = 50 p + 960 hPa,
    wind = 25 w + 40 m/s. GPH crops (100 x 100) are resized to 64 x 64 bilinearly and scaled with the
    range (44490.578125, 58768.4486860389), clipped to [0, 1].
  - >
    Env-Data features that are not yet defined (value -1, e.g. the 24-hour history at a track's start)
    are replaced by the first defined value in the window, as the official loader does. The Env-Data files
    also contain future-looking keys (future_direction24, future_inte_change24), which are not read.
  - >
    The whole requested split is loaded into memory (about 0.13 MB per sample); restrict ``areas``,
    ``splits`` or ``max_samples`` for large runs. Env-Data files are pickled numpy objects (loaded with
    allow_pickle); only read files from the official release.
typical_use_cases:
  - Training and evaluating TropiCycloneNet (``tropicyclonenet``) with its official inputs.
  - Multi-basin track and intensity forecasting at 6-24 h scored with the cyclone benchmark.
access_links:
  - label: TCND on Zenodo (10.5281/zenodo.15009527)
    url: https://doi.org/10.5281/zenodo.15009527
  - label: TCN_M training data on Zenodo (record 17104690)
    url: https://zenodo.org/records/17104690
  - label: TropiCycloneNet-Dataset repository
    url: https://github.com/xiaochengfuhuo/TropiCycloneNet-Dataset
inspection: null
registry:
  name: tropicyclonenet_dataset
  example: |
    from pyhazards.datasets import load_dataset

    data = load_dataset(
        "tropicyclonenet_dataset",
        data1d_dir="TCND/bst_divi10_train_val_test_inlcude15_2023",
        env_dir="TCND/all_area_correct_location_includeunder15_2023",
        gph_dir="TCND/all_ocean_gph500_2023",
        areas=["WP"],
        splits=["test"],
    ).load()
    test = data.get_split("test")
    print(test.inputs["obs_traj"].shape, test.inputs["image_obs"].shape, test.targets.shape)
  notes:
    - "Inputs are a dict: obs_traj / obs_traj_rel (8, N, 4), image_obs (N, 1, 8, 64, 64), env_data (nine arrays (N, 8, width)); targets (N, 4, 4) = lat, lon, pres, wind at 6-24 h."
    - "root= is accepted when the three folders are named BST_data, Env_data and ERA5_gph500."
primary_references:
  - citation: "Huang, C., P. Mu, J. Zhang, S. Chan, S. Zhang, H. Yan, S. Chen and C. Bai (2025). Benchmark dataset and deep learning method for global tropical cyclone forecasting. Nature Communications 16, 5923."
    url: https://doi.org/10.1038/s41467-025-61087-4
pyhazards_usage:
  - >
    Score ``tropicyclonenet`` (or any model with a ``forecast`` method returning lat / lon / pres / wind)
    with the ``tc`` benchmark; sampled forecasts get the paper's best-of-k errors and sample-mean errors.
related_models:
  - tropicyclonenet
related_benchmarks:
  - tropical_cyclone_benchmark
  - tropicyclonenet_dataset
notes:
  - >
    Licence: the Zenodo releases are CC BY 4.0 (the GitHub dataset repository has no LICENSE file although
    its README mentions MIT). PyHazards never redistributes the data; tests use one storm's real Data1d and
    Env-Data files (EP 2018 Carlotta, tests/fixtures/tcnd) and generated geopotential crops of the real shape.
