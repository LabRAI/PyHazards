slug: hurricast_synthetic
display_name: Synthetic Hurricast Inputs
hazard_family: Tropical Cyclone
source_role: Synthetic Smoke Data
summary: "Random inputs in the hurricast_ibtracs_era5 layout (8 steps of 30 statistical features and 9 maps of 25 x 25) for smoke tests of hurricast."
provider: PyHazards (generated in memory; no real storms)
geometry: Feature sequences and image sequences
spatial_resolution: Not applicable (random numbers)
temporal_resolution: Not applicable (random numbers)
update_cadence: Generated on every load
period_of_record: None (synthetic)
coverage: None (synthetic)
formats: PyTorch tensors via the dataset registry
overview:
  - >
    Synthetic data. Every value is a random number; nothing in it describes real tropical cyclones and
    scores on it mean nothing. It exists so that smoke tests and CI can run hurricast and the cyclone
    benchmark without IBTrACS or ERA5 files.
data_characteristics:
  - "x_stat (N, 8, 30) with standard-normal numerical features, cyclic encodings in [-1, 1] and valid one-hot basin / nature columns; x_viz (N, 8, 9, 25, 25) standard normal; position (N, 2); targets random winds (kt) or positions (target='displacement')."
typical_use_cases:
  - Smoke tests and CI runs of hurricast and of the cyclone benchmark.
access_links: []
inspection: null
registry:
  name: hurricast_synthetic
  example: |
    from pyhazards.datasets import load_dataset

    data = load_dataset("hurricast_synthetic", micro=True).load()
    print(data.metadata["synthetic"])  # True
primary_references:
  - citation: PyHazards synthetic smoke data (pyhazards/datasets/tc/synthetic.py)
    url: https://github.com/LabRAI/PyHazards
pyhazards_usage:
  - Use only for smoke tests; real data come from hurricast_ibtracs_era5.
related_models:
  - hurricast
related_benchmarks:
  - tropical_cyclone_benchmark
notes:
  - Bundle metadata carries synthetic=True, and benchmark results report it.
