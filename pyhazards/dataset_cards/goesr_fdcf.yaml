slug: goesr_fdcf
display_name: GOES-R ABI Fire/Hot Spot Characterization (FDCF)
hazard_family: Wildfire
source_role: Active Fire Detections
summary: NOAA's GOES-R ABI Level-2 fire detection and characterization product on the full-disk scan, every 10 minutes since April 2019, openly distributed on AWS.
provider: NOAA NESDIS GOES-R Series; Fire Detection and Characterization Algorithm (FDCA) from UW-Madison CIMSS
geometry: Raster imagery time series on the ABI fixed grid
spatial_resolution: 2 km at nadir (5424 x 5424 full-disk fixed grid)
temporal_resolution: A full-disk product every 10 minutes since 2 April 2019 (scan mode 6); every 15 minutes before (mode 3)
update_cadence: Continuous operational production
period_of_record: From 24 May 2017 (GOES-16); see the notes for the per-satellite archives
coverage: The full disk of each GOES satellite (GOES-East and GOES-West positions over the Americas)
formats: NetCDF-4 (CF-1.7) in the geostationary projection
overview:
  - >
    ABI-L2-FDCF is the full-disk version of the GOES-R Fire/Hot Spot Characterization product. The
    FDCA algorithm (the operational version of WFABBA) flags fire pixels in Advanced Baseline Imager
    data and estimates their fire radiative power, temperature and area.
  - >
    It gives geostationary fire activity every 10 minutes, much more often than the polar-orbiting
    MODIS and VIIRS detections distributed by FIRMS, at a coarser 2 km pixel.
data_characteristics:
  - >
    Variables: Mask (fire category codes, e.g. 10 good-quality fire, 11 saturated, 12 cloud
    contaminated, 13-15 high / medium / low probability, 30-35 their temporally filtered
    versions), Power (MW), Temp (K), Area (m2) and DQF, plus viewing angles and summaries.
  - Pixels are on the ABI fixed grid (geostationary projection) and need reprojection for latitude-longitude work.
  - >
    AWS buckets per satellite: noaa-goes16 (2017-05-24 to 2025-04-07), noaa-goes17 (2018-08-27 to
    January 2023), noaa-goes18 (from 2022-05-11) and noaa-goes19 (from 2024-10-17); GOES-East data
    after April 2025 are in noaa-goes19. Keys look like ABI-L2-FDCF/YYYY/DDD/HH/OR_ABI-L2-FDCF-M6_G16_s....nc.
typical_use_cases:
  - High-frequency fire activity time series over the Americas.
  - Fire radiative power for growth and intensity analyses.
  - Timing ignitions more precisely than polar-orbiting detections allow.
access_links:
  - label: NOAA NESDIS GOES-R series data products
    url: https://www.nesdis.noaa.gov/our-satellites/currently-flying/goes-east-west/goes-r-series-data-products
  - label: NOAA GOES on the AWS Registry of Open Data
    url: https://registry.opendata.aws/noaa-goes/
  - label: NOAA STAR GOES-R fire product page
    url: https://www.star.nesdis.noaa.gov/goesr/product_land_fire.php
pyhazards_usage:
  - >
    PyHazards does not load this product; it is listed as an external reference. The ``goesr``
    entry covers ABI imagery in general.
primary_references:
  - citation: Schmidt (2020). Monitoring Fires with the GOES-R Series. In The GOES-R Series, Elsevier, 145-163.
    url: https://doi.org/10.1016/B978-0-12-814327-8.00013-5
  - citation: GOES-R Algorithm Working Group (2018). NOAA GOES-R Series ABI Level 2 Fire/Hot Spot Characterization (FDC). NOAA NCEI.
    url: https://doi.org/10.7289/V5X065CR
  - citation: Schmidt, Hoffman, Prins and Lindstrom (2020). GOES-R ABI Algorithm Theoretical Basis Document for Fire / Hot Spot Characterization, version 2.7. NOAA NESDIS STAR.
    url: https://www.star.nesdis.noaa.gov/atmospheric-composition-training/documents/ABI_FDC_ATBD.pdf
related_models: []
related_benchmarks: []
notes:
  - >
    Terms: NOAA Open Data Dissemination states that the data "are open to the public and can be
    used as desired", requests attribution and forbids implying NOAA endorsement. The "license"
    attribute inside the NetCDF files ("Access is restricted to approved users only") is
    boilerplate that does not apply to the open distribution.
