slug: caravan_streamflow
display_name: Caravan
hazard_family: Flood
source_role: Streamflow Benchmark
summary: Reader for a local copy of Caravan, the global large-sample hydrology dataset (daily ERA5-Land forcings, catchment attributes and observed streamflow), in NeuralHydrology's sample layout.
provider: Caravan community dataset (Kratzert et al. 2023), read by PyHazards from a local copy
geometry: Daily basin time series with static attributes
spatial_resolution: Catchment averages (one series per gauge)
temporal_resolution: Daily
update_cadence: Versioned Zenodo releases (netCDF and CSV editions) plus community extensions
period_of_record: 1981-2020 in the original release (later versions extend it)
coverage: 6,830 catchments in the original release (Australia, Brazil, Canada, Chile, Great Britain, Central Europe, United States) plus extensions
formats: Per-basin netCDF or CSV time series; per-source attribute CSV files
overview:
  - >
    Caravan (Kratzert et al., Scientific Data 10:61, 2023) harmonises the CAMELS-style datasets of several
    countries: every basin has daily ERA5-Land forcings and states (precipitation, temperature, radiation,
    pressure, wind, soil water, evaporation, ...) aggregated over the catchment in local time, observed
    streamflow in mm/day, and HydroATLAS / ERA5-Land climate attributes. The Zenodo records are licensed
    CC BY 4.0, with per-source licence notes in the dataset's ``licenses/`` folder.
  - >
    ``caravan_streamflow`` reads that layout (as NeuralHydrology's ``Caravan`` dataset does) and builds
    streamflow samples: ``seq_length``-day windows of the chosen dynamic inputs ``x_d``, the basin's static
    attributes ``x_s`` and the discharge series ``y``, normalised with training-period statistics, split
    into the train / val / test periods you pass. PyHazards downloads nothing.
data_characteristics:
  - "Layout: ``attributes/<source>/attributes_{caravan,hydroatlas,other}_<source>.csv`` (column ``gauge_id``) and ``timeseries/{netcdf,csv}/<source>/<source>_<id>.{nc,csv}``; basin ids are ``<source>_<id>``."
  - Inputs and target are standardised with the mean and population standard deviation over all training basins and days; static attributes with their mean and standard deviation over the training basins, sorted alphabetically (NeuralHydrology's order).
  - Training samples with a missing input in the window or a missing target on the last day are dropped; validation and test keep one sample per basin and day so that metrics cover the whole period.
  - Caravan publishes no single input set or split, so ``dynamic_inputs`` and ``periods`` are required.
typical_use_cases:
  - Regional or global LSTM streamflow models (``neuralhydrology_lstm``, ``neuralhydrology_ealstm``, ``google_flood_forecasting``).
  - Per-basin NSE / KGE evaluation with the flood benchmark (``flood.streamflow``).
access_links:
  - label: Caravan paper (Scientific Data 2023)
    url: https://doi.org/10.1038/s41597-023-01975-w
  - label: Caravan repository
    url: https://github.com/kratzert/Caravan
  - label: Caravan netCDF release (Zenodo)
    url: https://doi.org/10.5281/zenodo.6522634
inspection: null
registry:
  name: caravan_streamflow
  example: |
    from pyhazards.datasets import load_dataset

    data = load_dataset(
        "caravan_streamflow",
        data_dir="/data/Caravan",
        basins=["camelsgb_28015", "lamah_215"],
        dynamic_inputs=["total_precipitation_sum", "temperature_2m_mean", "potential_evaporation_sum"],
        static_attributes=["p_mean", "aridity", "area"],
        periods={"train": ("1981-10-01", "1990-09-30"), "test": ("2000-10-01", "2010-09-30")},  # your split
        seq_length=365,
    ).load()
    inputs, y = data.get_split("test").inputs[0]
    print(inputs["x_d"].shape, inputs["x_s"].shape, y.shape)
primary_references:
  - citation: "Kratzert et al. (2023). Caravan - A global community dataset for large-sample hydrology. Scientific Data 10:61."
    url: https://doi.org/10.1038/s41597-023-01975-w
    repo_url: https://github.com/kratzert/Caravan
pyhazards_usage:
  - Point ``data_dir`` at an extracted Caravan release and pass basin ids (or a basin file), dynamic inputs and periods.
  - Score models with ``BenchmarkRunner`` on the ``flood`` benchmark (task ``flood.streamflow``).
related_models:
  - neuralhydrology_lstm
  - neuralhydrology_ealstm
  - google_flood_forecasting
related_benchmarks:
  - flood_benchmark
  - caravan
notes:
  - The reader is checked against NeuralHydrology's Caravan dataset on real Caravan basin files (oracle test).
  - Until 2026-10 this registry name generated random numbers; it now reads only real Caravan files (synthetic data is ``flood_streamflow_synthetic``).
