settings:
  - "Every image (whole frame, grid overlay or tile) is resized to 448 x 448 with ``PIL.Image.resize`` before the processor, as in the authors' ``QwenVL.predict``; the paper does not mention it. ``image_size=None`` keeps the native resolution."
  - "Chat template with the image before the text; up to 128 new tokens; a Markdown ``json`` fence is stripped from the answer."
  - "The authors' script loads the weights with ``torch_dtype=\"auto\"`` (bfloat16) and ``device_map=\"auto\"`` and never sets a temperature, so its runs used the checkpoint's generation config (``do_sample=True``, temperature 1e-6, repetition penalty 1.05: effectively greedy)."
deviations:
  - "Samples at temperature 0.5 as the paper states (other sampling parameters from the checkpoint's generation config); ``do_sample=False`` reproduces the effectively greedy decoding of the released script."
  - "The 12 tiles of an image are generated as one left-padded batch (the authors also batch them; their padding side is the processor default)."
  - "Detection boxes are scored in the pixel frame of the original image, as in the authors' script, although the model answers in the frame of its 448 x 448 input, so a box placed correctly on that input generally misses the ground-truth box of the 2048 x 1536 or 3072 x 2048 frame (Table 8: 0.000)."
notes:
  - "``build_backend`` loads Hugging Face revision ``cc594898137f460bfe9f0759e9844b3ce807cfb5`` (2026-10-07) unless ``revision=`` is given. The SmokeBench runs did not pin a revision."
  - "Section 5.2 of the paper says Qwen2.5-VL-7B underperforms the 32B model on tiles, but Table 4 gives 0.456 (7B) against 0.435 (32B); the numbers above are the tables'."
