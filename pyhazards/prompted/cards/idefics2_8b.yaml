settings:
  - "bfloat16 weights, ``do_image_splitting=False``."
  - "Classification, grid and detection: the raw text ``\"<image>\\n\" + prompt`` without the chat template through the ``image-text-to-text`` pipeline (256 new tokens, the checkpoint's greedy generation config)."
  - "Tiles: the 12 tiles of an image as one left-padded batch through the chat template, greedy, 16 new tokens."
deviations:
  - "Samples at temperature 0.5 as the paper states; ``do_sample=False`` reproduces the greedy decoding of the released script."
notes:
  - "``build_backend`` loads Hugging Face revision ``2c42686c57fe21cf0348c9ce1077d094b72e7698`` (2026-10-07) unless ``revision=`` is given (the base checkpoint, not the instruction-tuned ``idefics2-8b-chatty``; the paper says only \"Idefics2\" and the script loads ``idefics2-8b``)."
  - "SmokeBench notes that Idefics2 answers close to chance on smoke-free images (0.498), which inflates its accuracy on smoke images."
