settings:
  - "Same code path as the 7B model (``QwenVL`` in the authors' script, switched to the 32B checkpoint): 448 x 448 input, chat template, 128 new tokens, ``json`` fence stripped, ``torch_dtype=\"auto\"``, ``device_map=\"auto\"``, checkpoint generation config (temperature 1e-6)."
deviations:
  - "Samples at temperature 0.5 as the paper states; ``do_sample=False`` reproduces the effectively greedy decoding of the released script."
  - "Detection boxes are scored in the pixel frame of the original image (as the authors do) although the model answers in its 448 x 448 input frame."
notes:
  - "``build_backend`` loads Hugging Face revision ``7cfb30d71a1f4f49a57592323337a4a4727301da`` (2026-10-07) unless ``revision=`` is given. The weights are about 68 GB in bfloat16."
