settings:
  - "The authors run the transformers-native checkpoint ``OpenGVLab/InternVL3-14B-hf`` through the ``image-text-to-text`` pipeline with float32 weights (``device_map=\"balanced\"``): chat template with the image before the text, the processor's dynamic 448-pixel tiling at native resolution, 256 new tokens (the pipeline default) and the checkpoint's greedy generation config."
  - "The tile task was not run with InternVL3 (the paper's Tables 4-5 have no InternVL3 row; the script has no batch path for it)."
deviations:
  - "Samples at temperature 0.5 as the paper states; ``do_sample=False`` reproduces the greedy decoding of the released script."
  - "``device_map=\"auto\"`` by default (pass ``device_map=\"balanced\"`` to match the authors' sharding; it does not change outputs)."
notes:
  - "``build_backend`` loads Hugging Face revision ``e22931943e5336f85e06f4e2b38f3e5e6ee4de3b`` (2026-10-07) unless ``revision=`` is given. About 30 GB in bfloat16; the authors' float32 load needs about 60 GB."
  - "SmokeBench groups InternVL3 with the grounding-trained models; prompted with the SmokeBench detection prompt it still scores 0.000."
