    url: https://github.com/xuguangning1218/TI_Prediction.git
    commit: 651ccc4ec5d2139c758148778d617583052f2eea
    license: none (no LICENSE file; test oracle only, never vendored)
  TropiCycloneNet:
    # Huang et al., Nature Communications 2025. The GitHub repository has no LICENSE file; its model code
    # (TCNM/*.py) is identical, up to line endings, to the CC BY 4.0 Zenodo release 10.5281/zenodo.15024028
    # (TropiCycloneNet.zip, git b4e7101) that pyhazards/models/tropicyclonenet.py ports. The GitHub copy
