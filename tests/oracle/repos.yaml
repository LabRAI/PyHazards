    url: https://huggingface.co/datasets/d-michail/firecastnet-artifacts/resolve/f0bd28428d36b933ef4fb581189c741bf4ed1a10/model_ckpts/firecastnet-regr-ts24-h1.ckpt
    sha256: 2b3bcf43fe853bee04b6bf2250facf10184ec9eaa2114633b74b71eec5b6ccb2
    license: Apache-2.0
  firecastnet_lam_aust_cls_ts24_h1:
