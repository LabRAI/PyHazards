# Reference implementations that the oracle tests compare PyHazards models against.
# Each entry is pinned to an exact commit or checksum. They are fetched only for testing
# (scripts/fetch_oracles.py) and are never copied into the pyhazards package.
repos:
  utae-paps:
    url: https://github.com/VSainteuf/utae-paps.git
    commit: 987874e27a98bb399277f2d55eb010744d26f881
    license: MIT
  WildfireSpreadTS:
    url: https://github.com/SebastianGer/WildfireSpreadTS.git
    commit: f62dc49f2c2a6d249c071533ae5340c0d01bfb95
    license: MIT
  firecastnet:
    url: https://github.com/SeasFire/firecastnet.git
    commit: dc0d131be7f0638e3a84c16817e7bc9be454e53e
    license: none at repo level; seasfire/backbones/graphcast/* carry NVIDIA SPDX Apache-2.0 headers (test oracle only, never vendored)

assets:
