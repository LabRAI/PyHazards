    url: https://github.com/Alexander-wu/EarthFarseer.git
    commit: 258d4bb56497a6fb4022a5c37dec1e05ab1bedb1
    license: none (no LICENSE file; the README's Apache-2.0 badge links to OpenSTL's licence; test oracle only, never vendored)
  Rainformer:
    url: https://github.com/Zjut-MultimediaPlus/Rainformer.git
    commit: c4e04e9011b7bbc1201a781fe5e0e56530126120
    license: none (no LICENSE file; test oracle only, never vendored)

  uncertainty-wildfires:
    # Kondylatos et al., "Uncertainty-Aware Deep Learning for Wildfire Danger Forecasting"
    # (arXiv 2509.25017). The repository holds the paper's checkpoints, including the ten
    # deep-ensemble LSTMs in trained_models/ensembles/no-noisy (deep_ensemble oracle).
    url: https://github.com/Orion-AI-Lab/uncertainty-wildfires.git
    commit: fcfbfb894926d173e2f4cafc95b08f02cefe6e00
  SwinLSTM:
