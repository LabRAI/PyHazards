    url: https://github.com/xiaochengfuhuo/TropiCycloneNet.git
    commit: de9cf0e949bdee6e32cadf2605063b7bc6d33115
    license: none on GitHub; model code released under CC BY 4.0 on Zenodo (test oracle only, never vendored)

