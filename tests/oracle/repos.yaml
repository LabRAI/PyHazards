# Reference implementations that the oracle tests compare PyHazards models against.
# Each entry is pinned to an exact commit or checksum. They are fetched only for testing
# (scripts/fetch_oracles.py) and are never copied into the pyhazards package.
repos:
  utae-paps:
    url: https://github.com/VSainteuf/utae-paps.git
    commit: 987874e27a98bb399277f2d55eb010744d26f881
    license: MIT
  WildfireSpreadTS:
    url: https://github.com/SebastianGer/WildfireSpreadTS.git
    commit: f62dc49f2c2a6d249c071533ae5340c0d01bfb95
    license: MIT
  wildfire_forecasting:
    # Kondylatos et al., GRL 2022. Model code is identical to the v0.1-alpha release
    # (ee4f168, archived as Zenodo 10.5281/zenodo.6524771) that the paper cites.
    url: https://github.com/Orion-AI-Lab/wildfire_forecasting.git
    commit: 2b18bcf194284d56bd4e1774f7d5315db94cba34
    license: MIT
  Swin-Unet:
    url: https://github.com/HuCaoFighting/Swin-Unet.git
    commit: f48f623e226e25b6e395c37207915c50aaa9c776
    license: none (no LICENSE file; used only as a test oracle, never vendored)
  fire-asufm:
    url: https://github.com/bronteee/fire-asufm.git
    commit: 688dda94dec9e3b22f149f2b9335d3b38fd2277f
    license: Apache-2.0

